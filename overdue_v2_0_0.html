/* ══════════════════════════════════════════════════════════════════════
   v4.4.1: threatClimate — プリセット & キャップ（clamp）
   ──────────────────────────────────────────────────────────────────────
   ハードキャップ: floor ≤ 1.67 / slope ≤ 1.17。
   slope 1.17 の由来 = 証跡導出上限 1.159（DBIR 2026 のシェア移動の閉形式
   (1−0.20)/(1−0.31)）＋運用余裕。どの導出法でもこれを超える値には到達しない。
   超過値は黙って通さずクランプ＋警告フラグを返す（calc_test INV-T6）。
   出典は {evidenceIds, display} 構造（DC-2: MAAZ ATLAS 採点ルーブリックの証拠集合と
   非交差であることを機械照合できる形）。証跡IDは内部の脅威環境分析（本リポジトリ非同梱）の
   PART1 の E1〜E19 を正とする。 */
const CLIMATE_CAP = { floor: 1.67, slope: 1.17 };
const CLIMATE_CAP_NOTE = 'キャップの由来: slope 1.17 = 証跡導出上限 1.159（DBIR 2026 のシェア移動の閉形式 (1−0.20)/(1−0.31)）＋運用余裕。floor 1.67 は床側の妥当上限で、現時点の適格時系列では到達しません。';
/* 再評価間隔（UK AISI のAI能力倍加加速 8→4.7ヶ月 の翻訳。R-5: 係数ではなくレビュー頻度へ） */
const CLIMATE_REVIEW_MONTHS = 6;
/* GTG-1002（n=1）は係数入力に不使用（R-4）。事前登録の再導出トリガとして明文化する。 */
const CLIMATE_TRIGGER_NOTE = '再導出トリガ（事前登録）: 同等の自律度（人間の意思決定点が一桁台）のキャンペーンが独立2社以上から12ヶ月以内に累計3件以上報告された場合、slope を再導出します。';
/* 床のソフト警告帯（>1.10）。クランプはしない（ハードキャップは 1.67 のまま）。 */
const CLIMATE_FLOOR_WARN = 1.10;
const CLIMATE_FLOOR_WARN_MSG = '床の引き上げには、成熟度非依存事象の<strong>発生率</strong>時系列（構成比・条件付き成功率は不可）が必要です。現時点の適格時系列（GTIG実悪用ゼロデイ）は有意な増加を示していません';

const CLIMATE_PRESETS = {
  'baseline-2020s': {
    label: '2020年代前半基準', floor: 1.00, slope: 1.00,
    source: { evidenceIds: [], display: '現行基準（DBIR/Ponemon 現行値・出荷時デフォルト。ベンダーが黙って上げない原則）' },
    asOf: '', locked: true,
  },
  'ai-era-2026-conservative': {
    label: '2026年基準・保守', floor: 1.00, slope: 1.10,
    source: { evidenceIds: ['E4','E7','E8','E12'], display: 'Verizon DBIR 2026（悪用シェア20%→31%・パッチ中央値32→43日、期間2024-11〜2025-10）＋Mandiant M-Trends 2026（TTE −1日→−7日）→ 曝露窓33→50日を飽和補正しベクトル重み加重、+6〜14%の保守側1.10。床は据置。基準日2026-07' },
    asOf: '2026-07', locked: true,
  },
  'evidence-upper-2026': {
    label: '2026年基準・実測寄り（上限側仮定）', floor: 1.00, slope: 1.15,
    source: { evidenceIds: ['E7'], display: 'DBIR 2026 シェア移動の閉形式 (1−0.20)/(1−0.31)=1.159 を切下げ。「他ベクトル絶対数据置」という検証不能仮定に依存する上限値。基準日2026-07' },
    asOf: '2026-07', locked: true, upperBound: true,
  },
  'custom': {
    label: 'カスタム', floor: null, slope: null,
    source: { evidenceIds: [], display: '' },
    asOf: '', locked: false,
  },
};

/* 出典の表示テキスト。source は {evidenceIds, display} 構造（旧・自由文字列も後方互換で許容）。 */
function climateSourceText(src){
  if (!src) return '';
  return typeof src === 'string' ? src : (src.display || '');
}
/* 出典の証跡ID配列（DC-2 の非交差チェック用）。構造化されていなければ空配列。 */
function climateEvidenceIds(src){
  return (src && typeof src === 'object' && Array.isArray(src.evidenceIds)) ? src.evidenceIds : [];
}
/* プリセット基準日（asOf 'YYYY-MM'）からの経過月数。形式不正・空なら null（陳腐化判定しない）。 */
function climateAgeMonths(asOf, now){
  const m = /^(\d{4})-(\d{2})$/.exec(String(asOf || '').trim());
  if (!m) return null;
  const d = now || new Date();
  return (d.getFullYear() - +m[1]) * 12 + (d.getMonth() + 1 - +m[2]);
}
/* 現在の climate 選択に対する開示情報（ラベル/出典/証跡ID/基準日）を一箇所で解決する。
   固定プリセットはプリセット定義が一次情報（STATE.climateSource は custom 入力と JSON 復元の
   保持領域にすぎず、初期ロード直後は空 → 直参照すると「（未設定）」になる。QA m-4）。 */
function climateDisclosure(S){
  const st = S || STATE;
  const p = CLIMATE_PRESETS[st.climatePreset] || CLIMATE_PRESETS['baseline-2020s'];
  const isCustom = st.climatePreset === 'custom';
  return {
    preset: p, label: p.label,
    source: isCustom ? (st.climateSource || '') : climateSourceText(p.source),
    evidenceIds: climateEvidenceIds(p.source),
    asOf: isCustom ? (st.climateDate || '') : (p.asOf || ''),
  };
}

/* v1.10.0 (W1-7 / C-4): climateAgeMonths() を UI へ配線（従来は定義のみでデッドコードだった）。
   既存定数 CLIMATE_REVIEW_MONTHS(=6) を超えていれば「再評価期限超過」の warn バッジ、
   以内なら経過月数の中立表示。新しい判定基準は作らない。asOf 未設定（'' / 形式不正）は非表示。 */
function climateAgeBadge(asOf){
  const raw = climateAgeMonths(asOf);
  if (raw == null) return '';
  const m = Math.max(0, raw);
  const over = m > CLIMATE_REVIEW_MONTHS;
  return '<span style="display:inline-block;padding:2px 10px;border-radius:99px;font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;background:'
    + (over ? 'color-mix(in oklab,var(--warn) 16%,transparent)' : 'var(--bg-2)') + ';color:' + (over ? 'var(--warn-ink)' : 'var(--ink-3)') + '">'
    + (over ? '再評価期限超過 — 基準日から' + m + 'ヶ月経過（再評価間隔 ' + CLIMATE_REVIEW_MONTHS + 'ヶ月）' : '基準日から' + m + 'ヶ月')
    + '</span>';
}

/* 値を上限でクランプし {floor, slope, clamped, msgs} を返す。 */
function clampClimate(floor, slope){
  let f = Number.isFinite(+floor) ? +floor : 1.0;
  let s = Number.isFinite(+slope) ? +slope : 1.0;
  const msgs = [];
  if (f < 1.0){ f = 1.0; msgs.push('climateFloor は 1.0 未満に設定できません（1.0 に補正）'); }
  if (s < 1.0){ s = 1.0; msgs.push('climateSlope は 1.0 未満に設定できません（1.0 に補正）'); }
  if (f > CLIMATE_CAP.floor){ f = CLIMATE_CAP.floor; msgs.push(`climateFloor は上限 ${CLIMATE_CAP.floor} を超えられません（クランプ）`); }
  if (s > CLIMATE_CAP.slope){ s = CLIMATE_CAP.slope; msgs.push(`climateSlope は上限 ${CLIMATE_CAP.slope} を超えられません（クランプ）`); }
  return { floor: f, slope: s, clamped: msgs.length > 0, msgs };
}

/* プリセット適用。custom は出典テキスト+基準日が空なら適用ブロック（false 返し）。 */
function applyClimatePreset(key, opts){
  const p = CLIMATE_PRESETS[key];
  if (!p) return false;
  if (key === 'custom'){
    const o = opts || {};
    const src = (o.source ?? STATE.climateSource ?? '').trim();
    const dt  = (o.date ?? STATE.climateDate ?? '').trim();
    if (!src || !dt) return { blocked: true, reason: 'custom は出典テキストと基準日の両方が必須です' };
    const c = clampClimate(o.floor, o.slope);
    STATE.climateFloor = c.floor; STATE.climateSlope = c.slope;
    STATE.climatePreset = 'custom'; STATE.climateSource = src; STATE.climateDate = dt;
    return { blocked: false, clamped: c.clamped, msgs: c.msgs };
  }
  STATE.climateFloor = p.floor; STATE.climateSlope = p.slope;
  STATE.climatePreset = key; STATE.climateSource = climateSourceText(p.source); STATE.climateDate = p.asOf;
  return { blocked: false, clamped: false, msgs: [] };
}

/* ══════════════════════════════════════════════════════════════════════
   v4.4.1 Phase 2: ZTD Exposure / KPI 層（物量ベース・恒等式とは独立の第2レンズ）
   ──────────────────────────────────────────────────────────────────────
   金額の唯一の真実は calc()（恒等式 INV-D4）。本層は「件数・比率・日数」の物量で
   負債を可視化し、集約残高（返済可能+STALLED）を物量比で按分して内訳を出す。
   保証すべき性質（calc_test で機械検証）:
     INV-D3  可視化(UNKNOWN→VISIBLE)は残高を1円も動かさない
     INV-D6  項目別按分(P50)の総和 ≤ 集約残高、union後は等号（レンジは集約のみ）
     INV-D7  エージング(滞留日数)は残高を変えない（返済優先順位付け専用）
   ────────────────────────────────────────────────────────────────────── */

/* 値を [0,1] にクランプ。数値でなければ null（KPI未計上）。 */
function clamp01(v){ const n = +v; return Number.isFinite(n) ? Math.max(0, Math.min(1, n)) : null; }

/* ── 設計判断（QA レビュー M-1 反映・2026-07-15）───────────────────────────
   金額残高の唯一の駆動は ZTMM成熟度遷移（effRisk）＝ ztdBalance = ztdAsIs − effRisk。
   アクセス状態機械（UNKNOWN/VISIBLE/ENFORCED の件数）は「KPI層・優先順位付け・乖離アラート」
   専用であり、残高を1円も動かさない（顧客自己申告の件数が金額を動かすと INV-D4 恒等式・
   来歴規律を壊すため意図的に非配線）。これにより「可視化≠返済（INV-D3）」「エージングは残高を
   変えない（INV-D7）」が production 経路 calc().ztdBalance で自然に成立する（calc_test で検証）。
   ─────────────────────────────────────────────────────────────────────────── */

/* 集約P50を各タグの物量比で按分（union/正規化）。総和は必ず aggP50（union後は等号・INV-D6）。
   レンジ(P10/P90)は集約レベルのみ。項目別は単一P50数値のみ返す
   （レンジは線形加算で保存されないため項目別に按分しない）。 */
function ztdItemAllocation(tagCounts, aggP50){
  const keys = Object.keys(tagCounts || {});
  let totalW = 0;
  for (const k of keys) totalW += Math.max(0, +tagCounts[k] || 0);
  const out = {};
  for (const k of keys){
    const w = Math.max(0, +tagCounts[k] || 0);
    out[k] = totalW > 0 ? aggP50 * (w / totalW) : 0;
  }
  return out;
}

/* ヒアリング由来の負債カウントから exposure モデル（物量・状態分布・比率KPI）を構築。
   金額には一切触れない（金額は calc()＋按分が唯一の経路）。debtLoaded 未設定なら loaded:false。 */
function ztdBuildExposure(S){
  const num = v => Math.max(0, +v || 0);
  const loaded = !!S.debtLoaded;
  /* ① アクセス経路の状態機械（物量）。
     説明可能=申請ID紐付/列挙のみ計上（分子品質ゲート）。ENFORCED ⊆ VISIBLE(説明可能)。 */
  const accTotal = num(S.debtAccessTotalCount);
  const accExpl  = Math.min(accTotal, num(S.debtAccessExplainableCount));
  const accEnf   = Math.min(accExpl, num(S.debtAccessEnforcedCount));
  const stUnknown  = accTotal - accExpl;   // 説明すらできない = UNKNOWN
  const stVisible  = accExpl - accEnf;      // 説明可能・未強制 = VISIBLE
  const stEnforced = accEnf;                 // 強制済 = ENFORCED（返済）
  /* タグ別物量（②③④）— 内訳按分の重み。委託先は別勘定。 */
  const tagCounts = {
    exception: num(S.debtExceptionCount),
    orphan:    num(S.debtOrphanAssetCount),
    privilege: num(S.debtStandingPrivilegeCount),
  };
  const vendorCounts = {
    vendorAccess:     num(S.debtVendorAccessCount),
    vendorPrivileged: num(S.debtVendorPrivilegedCount),
  };
  /* 比率KPI（逆数訴求用の生値。分母0なら null=未計上） */
  const explainableRatio   = accTotal > 0 ? accExpl / accTotal : null;   // 説明可能アクセス比率
  const unexplainableRatio = explainableRatio == null ? null : 1 - explainableRatio;
  const enforcedRate       = accTotal > 0 ? accEnf / accTotal : null;    // ENFORCED遷移率
  const assetTotal = num(S.debtAssetTotalCount);
  const ownerUnknownRatio  = assetTotal > 0 ? Math.min(1, num(S.debtOrphanAssetCount) / assetTotal) : null;
  const staleExceptionRatio = clamp01(S.debtExceptionNoExpiryRatio);     // 期限超過(無期限化)例外率
  /* ゲーミング乖離アラート: 指標は綺麗（説明可能↑）だが実体（ENFORCED↓）が伴わない */
  const gap = (explainableRatio != null && enforcedRate != null) ? (explainableRatio - enforcedRate) : null;
  const gamingAlert = gap != null && explainableRatio >= 0.6 && enforcedRate <= 0.2 && gap >= 0.4;
  /* エージング（物量・返済優先順位専用。残高には効かない＝INV-D7） */
  const aging = { d0_30: num(S.debtAging_0_30), d30_90: num(S.debtAging_30_90), d90plus: num(S.debtAging_90plus) };
  return {
    loaded,
    state: { unknown: stUnknown, visible: stVisible, enforced: stEnforced, total: accTotal },
    tagCounts, vendorCounts,
    kpi: {
      explainableRatio, unexplainableRatio, enforcedRate, ownerUnknownRatio, staleExceptionRatio,
      avgOverdueDays: num(S.debtExceptionAvgOverdueDays),
      avgExtensions:  num(S.debtExceptionAvgExtensions),
      infiniteExtCount: num(S.debtExceptionInfiniteCount),
      noApproverRatio: clamp01(S.debtExceptionNoApproverRatio),
      unjustifiedPrivRatio: clamp01(S.debtStandingPrivilegeUnjustifiedRatio),
      gap, gamingAlert,
    },
    vendor: {
      accessCount: num(S.debtVendorAccessCount), legacyRatio: clamp01(S.debtVendorAccessLegacyRatio),
      privilegedCount: num(S.debtVendorPrivilegedCount), noExpiryRatio: clamp01(S.debtVendorPrivilegedNoExpiryRatio),
      certStatus: S.debtVendorCertStatus || '',
    },
    aging,
    evidenceLevel: S.debtEvidenceLevel || '',
  };
}

function buildZTDWaterfallSVG(R){
  const oku = x => x / 1e8;
  const fmtV = v => {
    const a = Math.abs(v);
    if (a >= 1) return v.toFixed(1) + '億';
    if (a >= 0.01) return (v * 10000).toFixed(0) + '万';
    return a === 0 ? '0' : '—';
  };
  /* フロー分解: 計上(AS-IS) から 返済(net) を引き、残高を STALLED+床+返済可能残高 に積む。
     ステップ型ウォーターフォール（累積 running total で表現）。 */
  const asis = oku(R.ztdAsIs);
  const steps = [
    { lb:'計上',        sub:'AS-IS期待損失', val: asis,               kind:'total',  c:'var(--danger)' },
    { lb:'返済',        sub:'net・実効',     val: -oku(R.ztdRepaidNet), kind:'flow',  c:'var(--trust)' },
    { lb:'返済可能残高', sub:'未検証信頼',    val: oku(R.ztdRepayable), kind:'stack',  c:'var(--c-risk)' },
    { lb:'STALLED',     sub:'摩擦滞留',      val: oku(R.ztdStalled),   kind:'stack',  c:'var(--warn)', striped:true },
    { lb:'不可避床',    sub:'確率的残存',    val: oku(R.ztdFloor),     kind:'stack',  c:'var(--ink-3)' },
  ];
  const w = 1000, h = 340, padT = 40, padB = 78, padL = 40, padR = 20;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const slotW = innerW / steps.length, barW = 56;
  const maxV = asis || 1;
  const scale = innerH / maxV;
  const baseY = padT + innerH;
  const toY = v => baseY - v * scale;
  // running total: 計上=満額から始め、返済で下げ、その後 残高バケットを 0 から積み上げ直す表現
  let running = asis;
  let bars = '';
  steps.forEach((s, i) => {
    const cx = padL + slotW * i + slotW / 2;
    const x = cx - barW / 2;
    let top, hgt, label;
    if (s.kind === 'total'){
      top = toY(asis); hgt = baseY - top; running = asis; label = fmtV(asis);
    } else if (s.kind === 'flow'){
      const from = running, to = running + s.val;   // s.val は負
      top = toY(from); hgt = toY(to) - toY(from); running = to; label = fmtV(s.val);
    } else {
      // stack: 残高バケットを 0 起点から積む（3本で残高を構成）
      top = toY(s.val); hgt = baseY - top; label = fmtV(s.val);
    }
    const fill = s.striped
      ? `fill="${s.c}" fill-opacity="0.55"`
      : `fill="${s.c}" fill-opacity="${s.kind==='total'?0.30:0.55}"`;
    const stripe = s.striped ? `<rect x="${x}" y="${top}" width="${barW}" height="${hgt}" rx="3" fill="url(#ztdStripe)"/>` : '';
    bars += `<rect x="${x}" y="${top}" width="${barW}" height="${Math.max(2,hgt)}" rx="3" ${fill}/>${stripe}`;
    bars += `<text x="${cx}" y="${top - 8}" text-anchor="middle" font-family="var(--font-mono)" font-size="12" font-weight="600" fill="var(--ink)">${label}</text>`;
    bars += `<text x="${cx}" y="${baseY + 22}" text-anchor="middle" font-family="var(--font-jp)" font-size="12" font-weight="600" fill="var(--ink)">${s.lb}</text>`;
    bars += `<text x="${cx}" y="${baseY + 40}" text-anchor="middle" font-family="var(--font-jp)" font-size="11" fill="var(--ink-3)">${s.sub}</text>`;
  });
  // 残高ブラケット（返済可能残高〜床 の3本が残高を構成する旨）
  const balX0 = padL + slotW * 2, balX1 = padL + slotW * 5;
  const balY = padT - 22;
  const balBracket = `
    <line x1="${balX0+8}" y1="${balY}" x2="${balX1-8}" y2="${balY}" stroke="var(--line-3)" stroke-width="1"/>
    <text x="${(balX0+balX1)/2}" y="${balY-6}" text-anchor="middle" font-family="var(--font-mono)" font-size="11" fill="var(--ink-3)" letter-spacing=".08em">ZTD 残高 = ${fmtV(oku(R.ztdBalance))}</text>`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:100%;height:auto" role="img" aria-label="ZTD 返済ウォーターフォール">
    <defs><pattern id="ztdStripe" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="transparent"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--warn)" stroke-width="2" stroke-opacity="0.5"/>
    </pattern></defs>
    <line x1="${padL}" y1="${baseY}" x2="${w-padR}" y2="${baseY}" stroke="var(--line-2)" stroke-width="1"/>

/* threatClimate を ±1 段階（プリセット間）切り替えた場合の 総残高 と 実効ROI を算出（感度開示）。
   v4.4.1: 単一値開示をやめ、同一係数変更（baseline→保守）の残高影響が
   「実装到達度 att × 組織摩擦（Forg）」でどれだけ振れるかのレンジも返す。
   att = AS-IS→理想TO-BE のギャップのうち実際に閉じた割合（att=1.0 で理想到達・摩擦なし）。
   両端は現在の STATE から実走して求める。既定 STATE での実測（2026-07-27）は
   att=1.00 で +1.39%、att=0.155 で +8.21%（Forg未連携・摩擦0）／+8.71%（Forg連携時・
   forgS/L=0.70, forgC/Lp=0.30）＝ 同一係数変更でも 5.9〜6.2 倍の幅。
   内部分析の原典値 +8.63% は att=0.155・摩擦ありの値（Forg設定差の範囲内で整合）。 */
const CLIMATE_SENS_ATT = [1.00, 0.155];
function ztdClimateSensitivity(){
  const KEYS = ['climateFloor','climateSlope','climatePreset','toBe_vulnCoeff','toBe_dlpVulnCoeff','forgLoaded'];
  const saved = {}; KEYS.forEach(k => saved[k] = STATE[k]);
  const runWith = (f, s, over) => {
    STATE.climateFloor = f; STATE.climateSlope = s;
    if (over) Object.assign(STATE, over);
    const r = calc();
    KEYS.forEach(k => STATE[k] = saved[k]);   // 実行ごとに確定値へ復元（副作用を残さない）
    return { balance: r.ztdBalance, effROI: r.effROI_pct };
  };
  const baseline     = runWith(1.00, 1.00);   // baseline-2020s
  const conservative = runWith(1.00, 1.10);   // ai-era-2026-conservative
  const upper        = runWith(1.00, 1.15);   // evidence-upper-2026
  const current      = runWith(saved.climateFloor, saved.climateSlope);
  /* att 端点での「baseline→保守」残高変化率（%）。att=1.0 は摩擦なし・理想到達。 */
  const stepPct = att => {
    const over = {
      toBe_vulnCoeff:    STATE.vulnCoeff    - att * (STATE.vulnCoeff    - STATE.toBe_vulnCoeff_ideal),
      toBe_dlpVulnCoeff: STATE.dlpVulnCoeff - att * (STATE.dlpVulnCoeff - STATE.toBe_dlpVulnCoeff_ideal),
      forgLoaded: att >= 1 ? false : saved.forgLoaded,
    };
    const b = runWith(1.00, 1.00, over).balance;
    const c = runWith(1.00, 1.10, over).balance;
    return b > 0 ? (c - b) / b * 100 : null;
  };
  const pcts = CLIMATE_SENS_ATT.map(stepPct).filter(x => x != null && Number.isFinite(x));
  const range = pcts.length ? { lo: Math.min(...pcts), hi: Math.max(...pcts) } : null;
  return { baseline, conservative, upper, current, range };
}

/* ══════════════════════════════════════════════════════════════════════
   v1.10.0 (Wave 2): 感度・比較・入力元帳（すべて表示層）
   ──────────────────────────────────────────────────────────────────────
   共通手法は ztdClimateSensitivity() と同じ「STATE 一時上書き → calc() → 復元」。
   エンジン（calc 本体・定数・恒等式）には一切触れない。新しい金額式も作らない
   （既存 calc() の return 値を、別の入力点で読み直しているだけ）。
   ztdClimateSensitivity() との違いは、例外時も必ず復元されるよう try/finally で
   一般化したこと（途中で throw しても STATE が汚れない）。
   ══════════════════════════════════════════════════════════════════════ */
function _deepCopy(v){
  if (v === null || typeof v !== 'object') return v;
  if (Array.isArray(v)) return v.map(_deepCopy);
  const o = {}; for (const k of Object.keys(v)) o[k] = _deepCopy(v[k]);
  return o;
}
/* over のキーだけを一時上書きして calc() を実行し、必ず元に戻す。
   上書き値はディープコピーして入れるため、復元後に外部オブジェクトと参照を共有しない。 */
function calcWithOverride(over){
  const keys = Object.keys(over || {});
  const saved = {};
  keys.forEach(k => { saved[k] = STATE[k]; });
  try {
    keys.forEach(k => { STATE[k] = _deepCopy(over[k]); });
    return calc();
  } finally {
    keys.forEach(k => { STATE[k] = saved[k]; });
  }
}

/* ── W2-2 (F-10): 組織摩擦 F の感度 ───────────────────────────────────
   F は Forg の4変数から F_org=(S×L)/(C×L') → F=F_org/(1+F_org) で決まるため、
   目標 F を直接与えるには F_org = F/(1−F) を満たす合成値を置けばよい
   （S=F/(1−F), L=C=L'=1）。式そのものは calc() 内の既存実装をそのまま通す。
   注意（実測に基づく仕様補正）: F は返済(net)=riskTotal×(1−F) にも効くため、
   残高そのものは F によって動く。全行で不変なのは「計上額(AS-IS)」と「不可避床」であり、
   各行で 残高 = 返済可能 + STALLED + 床 の恒等式が成立する。表ではその2点を明示する。 */
const FRICTION_SENS_POINTS = [0, 0.25, 0.50, 0.75];
function ztdFrictionSensitivity(){
  const R0 = calc();
  const cur = R0.ztdForgCoef;
  /* v1.10.0 (QA M-1b): 旧モデル（useUnifiedFriction=false）では F の定義そのものが違う
     （F=1−attRisk=δ×(1−L')）。統一摩擦モデルの格子で走らせた表を並べると、現在値行が
     「別モデルの数字」になって読者を誤らせるため、表自体を出さない。 */
  if (STATE.useUnifiedFriction === false) return { legacy: true, rows: [], current: cur };
  /* v1.10.0 (QA M-1a): 現在値は必ず自前の行として持つ。格子点への吸着（旧: |F−cur|<0.005）を
     やめ、重複除去は厳密一致（<1e-9）のときだけにする。現在値行の数値は合成上書きではなく
     実際の calc() 結果 R0 をそのまま使うので、表示残高は 00 残高照会と必ず一致する。 */
  const pts = FRICTION_SENS_POINTS.filter(p => Math.abs(p - cur) >= 1e-9).map(p => ({ F: p, current: false }));
  pts.push({ F: cur, current: true });
  pts.sort((a, b) => a.F - b.F);
  const rows = pts.map(pt => {
    const r = pt.current ? R0 : (() => {
      /* 目標 F を直接与える合成 Forg 変数: F_org = F/(1−F) を (S×L)/(C×L') に置く */
      const rawF = pt.F >= 0.999 ? 999 : pt.F / (1 - pt.F);
      return calcWithOverride({ forgLoaded: true, forgS: rawF, forgL: 1, forgC: 1, forgLp: 1 });
    })();
    return {
      F: pt.F, current: pt.current,
      repaidNet: r.ztdRepaidNet, balance: r.ztdBalance,
      stalled: r.ztdStalled, repayable: r.ztdRepayable, floor: r.ztdFloor, asIs: r.ztdAsIs,
      idErr: Math.abs(r.ztdBalance - (r.ztdRepayable + r.ztdStalled + r.ztdFloor)),
    };
  });
  return { legacy: false, rows, current: cur, asIs: R0.ztdAsIs, floor: R0.ztdFloor, forgLoaded: R0.ztd.forgLoaded };
}

/* ── W2-3 (F-4): 主要前提の感度（1変数ずつ ±50%・他は固定） ─────────────
   上書き値は既存の入力バリデーション範囲（比率系は [0,1]・日数は非負）にクランプする。 */
const ASSUMPTION_SENS = [
  { key:'churnLoss',  label:'解約・機会損失',      unit:'oku' },
  { key:'ipValue',    label:'知的財産価値',        unit:'oku' },
  { key:'impactRate', label:'事業影響率',          unit:'pct', min:0, max:1 },
  { key:'downDays',   label:'操業停止日数',        unit:'day', min:0 },
  { key:'baseRisk',   label:'baseRisk（残存床）',  unit:'pct2', min:0, max:1 },
];
/* 感度表・入力元帳の共通フォーマッタ（表示のみ）。 */
function sensFmt(unit, v){
  if (!Number.isFinite(v)) return '—';
  switch (unit){
    case 'oku':  return (v / 1e8).toFixed(2) + '億';
    case 'M':    return Math.round(v / 1e6).toLocaleString() + '百万';
    case 'pct':  return (v * 100).toFixed(1) + '%';
    case 'pct2': return (v * 100).toFixed(2) + '%';
    case 'day':  return v.toFixed(0) + '日';
    case 'num2': return v.toFixed(2);
    default:     return String(v);
  }
}
/* v1.10.0 (QA M-2): 残高だけを出すと、Forg未連携（F=0）の既定状態で
   「残高 = TO-BE残余」となり、AS-IS 側にしか効かない前提（事業影響率など）が
   一律 0.0% に見える＝「その前提は測らなくてよい」という逆の指示になっていた。
   計上額(AS-IS) と 返済(net) を併記して、どこに効いているのかを示す。すべて既存 return 値。 */
function ztdAssumptionSensitivity(){
  const R0 = calc();
  const base = { balance: R0.ztdBalance, asIs: R0.ztdAsIs, repaidNet: R0.ztdRepaidNet };
  return ASSUMPTION_SENS.map(d => {
    const cur = +STATE[d.key] || 0;
    const cl = v => {
      let x = v;
      if (d.min != null) x = Math.max(d.min, x);
      if (d.max != null) x = Math.min(d.max, x);
      return x;
    };
    const pick = r => ({ balance: r.ztdBalance, asIs: r.ztdAsIs, repaidNet: r.ztdRepaidNet });
    const lo = cl(cur * 0.5), hi = cl(cur * 1.5);
    return {
      key: d.key, label: d.label, unit: d.unit, cur, lo, hi, base,
      lov: pick(calcWithOverride({ [d.key]: lo })),
      hiv: pick(calcWithOverride({ [d.key]: hi })),
      clamped: Math.abs(lo - cur * 0.5) > 1e-12 || Math.abs(hi - cur * 1.5) > 1e-12,
    };
  });
}
/* 感度表の増減率表示。|pct| < 0.05 は表示上ゼロとして ±0.0% に統一する（−0.0% を出さない）。 */
function sensPct(now, was){
  if (!(Math.abs(was) > 0)) return '—';
  const p = (now - was) / was * 100;
  if (Math.abs(p) < 0.05) return '±0.0%';
  return (p > 0 ? '+' : '−') + Math.abs(p).toFixed(1) + '%';
}

/* ── W2-4 (F-9): 入力元帳（監査トレース） ─────────────────────────────
   出所は既存フラグ（hearingLoaded/hearingApplied・maazLoaded・forgLoaded）と
   デフォルト値の一致判定だけで機械判定する。新しい STATE は増やさない。 */
/* HEARING_MAP はこのブロックより後方で宣言されるため（TDZ）、参照は初回呼び出し時に遅延させる。 */

const MAAZ_DERIVED_KEYS = new Set(['vulnCoeff','dlpVulnCoeff','toBe_vulnCoeff','toBe_dlpVulnCoeff']);
const FORG_DERIVED_KEYS = new Set(['forgS','forgL','forgC','forgLp']);
const INPUT_LEDGER_ROWS = [
  { key:'revenue',       label:'連結売上高',              unit:'oku',  use:'事業停止B（日次売上×停止日数×影響率）' },

const SRC_DEFAULT_LABEL = 'デフォルト（架空・要差替え）';
/* v1.10.0 (QA m-7): 架空モデルケースで上書きされた値は「手入力」ではない。既存キーだけで
   デモ状態を判定する（loadDemoCase が customer / debtCustomer に「（架空）」を必ず前置する）。
   新しい STATE は増やさない。 */
function isDemoCase(){
  const c = String(STATE.customer || ''), dc = String(STATE.debtCustomer || '');

}
function inputSourceOf(key){
  const cur = STATE[key], def = STATE_DEFAULTS[key];

  const viaHearing = !!STATE.hearingLoaded && (STATE.hearingApplied > 0) && hearingKeySet().has(key);
  if (viaHearing && !isDefault)                              return { label:'ヒアリングシート', tone:'ok' };
  if (MAAZ_DERIVED_KEYS.has(key) && STATE.maazLoaded)        return { label:'MAAZ取込',         tone:'ok' };
  if (FORG_DERIVED_KEYS.has(key) && STATE.forgLoaded)        return { label:'Forg取込',         tone:'ok' };
  if (isDefault)                                             return { label:SRC_DEFAULT_LABEL,  tone:'warn' };

/* v1.10.0 (QA M-3): 投資見積もり5本の出所サマリ。00 残高照会の「返済原資」行の分岐に使う。
   判定は inputSourceOf() と同一規則（出荷時デフォルトと同値かどうか）で、独自基準は作らない。 */
const INVEST_KEYS = ['investVendor','investSI','investOps','investLBO','investOther'];
function investProv(){

/* ── W2-5 (C-1/F-7): 前回帳簿との比較（スナップショット差分） ───────────
   読み込んだ前回帳簿は STATE に入れず、この変数にセッション限りで保持する。
   STATE の外側にあるため exportLedgerJSON（STATE スプレッド）には含まれない。 */
let prevLedger = null;   /* { meta:{...}, R:{...} } — 前回スナップショットの calc() 結果（数値のみ） */
function importPrevLedgerJSON(){
  fileDialog('.json', text => {
    try {
      const d = JSON.parse(text);
      const f = String(d.format || '');
      /* 機械識別子 'endeavor-v1.x' は旧セッション互換のため受理を維持する */
      if (!f.startsWith('overdue') && !f.startsWith('endeavor')){ showToast('対応していない JSON 形式です', 'bad'); return; }
      /* 既存 importLedgerJSON と同一の正規化を、STATE ではなく「素の器」に対して行う */
      const st = _deepCopy(STATE_DEFAULTS);
      Object.keys(st).forEach(k => { if (k in d && d[k] !== undefined) st[k] = _deepCopy(d[k]); });
      /* 旧キー investZscaler → investVendor 後方互換（st は STATE_DEFAULTS のコピーのため同型で扱う） */
      if (d.investVendor === undefined && d.investZscaler !== undefined) st.investVendor = d.investZscaler;
      if (d.investClass && typeof d.investClass === 'object'
          && d.investClass.investVendor === undefined && d.investClass.investZscaler !== undefined){
        st.investClass = { ...d.investClass, investVendor: d.investClass.investZscaler };
        delete st.investClass.investZscaler;
      }
      const cname = (d.customer && typeof d.customer === 'object')
        ? (d.customer.company_name || d.customer_name || '')
        : String(d.customer || d.customer_name || '');
      st.customer = cname;
      /* STATE 全体を一時 swap して calc()（try/finally で必ず復元）。数値だけ取り出して保持する。 */
      const R = calcWithOverride(st);
      prevLedger = {
        meta: {
          date: String(st.date || ''), customer: cname, format: f,
          toolVersion: String(d.tool_version || ''),
          generatedAt: String(d.generated_at || d.exportedAt || ''),
        },
        R: {
          balance: R.ztdBalance, repayable: R.ztdRepayable, stalled: R.ztdStalled,
          floor: R.ztdFloor, repaidNet: R.ztdRepaidNet, asIs: R.ztdAsIs,
        },
      };
      renderAll();
      showToast('前回帳簿を比較用に読み込みました（現在の帳簿は変更していません）');
    } catch(e){
      /* v1.10.0 (QA m-3): prevLedger を落としたら必ず再描画する。旧実装は renderAll() を
         呼んでいなかったため、解析に失敗しても前回の差分カードが 00 に残り続けていた
         （format 不一致で早期 return する経路とも挙動が食い違っていた）。 */
      prevLedger = null;
      renderAll();
      showToast('比較用JSONの解析エラー: ' + e.message + '（前回帳簿との比較を解除しました）', 'bad');
    }
  });
}

/* 版・契約の相違（数字は出すが「版が異なる」注記を付ける）。 */
function prevLedgerVersionWarn(){

function fileDialog(accept, cb){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = accept;
  inp.onchange = e => { const f = e.target.files[0]; if(f){ const r = new FileReader(); r.onload = ev => cb(ev.target.result); r.readAsText(f); } };
  inp.click();
}

function importMAAZ(){

        }
        // (3) vulnCoeff 範囲
        ['asIsVulnCoeff','asIsVulnCoeffEffective','asIsVulnCoeffIdeal','toBeVulnCoeffEffective','toBeVulnCoeffIdeal'].forEach(k => {
          if (typeof ec[k] === 'number' && (ec[k] < 0 || ec[k] > 1.0)){
            showToast(`MAAZ データ異常: ${k} = ${ec[k]} (範囲 [0,1] 外)`, 'bad');
          }
        });
        /* (4) v1.8.0: MAAZ v3.4.0 の TO-BE SCF 範囲バリデーション。
           scfToBe が「無い」のはエラーではない（旧 MAAZ export として正常受理し、AS-IS 値へフォールバック）。
           在るのに [0,1] 外の場合のみ (3) と同方式で警告する。 */
        if (ec.byPillar && typeof ec.byPillar === 'object'){
          Object.keys(ec.byPillar).forEach(p => {
            const v = ec.byPillar[p] && ec.byPillar[p].scfToBe;
            if (typeof v === 'number' && (v < 0 || v > 1.0)){
              showToast(`MAAZ データ異常: byPillar.${p}.scfToBe = ${v} (範囲 [0,1] 外)`, 'bad');
            }
          });
        }
      }
      // (2) 古いバージョン警告
      if (d.tool_version && typeof d.tool_version === 'string'){
        // セマンティックに比較する簡易実装 (major.minor.patch を想定)
        const cmpVer = (a, b) => {
          const pa = a.split('.').map(x => parseInt(x,10)||0);
          const pb = b.split('.').map(x => parseInt(x,10)||0);
          for (let i=0; i<Math.max(pa.length,pb.length); i++){
            const da = pa[i]||0, db = pb[i]||0;
            if (da !== db) return da - db;
          }
          return 0;
        };
        if (cmpVer(d.tool_version, '1.0.3') < 0){
          showToast(`MAAZ v${d.tool_version} 検出: effectiveCoverage 二重加算バグの可能性. v1.0.3 以降推奨`, 'warn');
          console.warn(`MAAZ version ${d.tool_version} predates v1.0.3 fix`);
        }
      }

      /* === AS-IS vulnCoeff: v1.7.2 (QA Bug #1) MAAZ v1.0.3/1.0.4 両対応 ===
         MAAZ v1.0.4: asIsVulnCoeffEffective (SCF 補正済) + asIsVulnCoeffIdeal を export
         MAAZ v1.0.3: asIsVulnCoeff (Ideal のみ) を export — これが SCF未補正
         MAAZ v1.0.0: effectiveCoverage なし → threatCoverage から fallback 計算
         優先度: Effective → Ideal(asIsVulnCoeff) → threatCoverage 素値
         STATE.vulnCoeff_is_scf_corrected フラグを立て、toast の表現を正直にする (Bug #8)
      */
      STATE.vulnCoeff_is_scf_corrected = false;
      if (d.effectiveCoverage && typeof d.effectiveCoverage.asIsVulnCoeffEffective === 'number'){
        // MAAZ v1.0.4+: 真に SCF 補正済
        STATE.vulnCoeff        = d.effectiveCoverage.asIsVulnCoeffEffective;
        STATE.vulnCoeff_ideal  = d.effectiveCoverage.asIsVulnCoeffIdeal ?? d.effectiveCoverage.asIsVulnCoeffEffective;
        STATE.vulnCoeff_is_scf_corrected = true;
      } else if (d.effectiveCoverage && typeof d.effectiveCoverage.asIsVulnCoeff === 'number'){
        // MAAZ v1.0.3: asIsVulnCoeff は Ideal 値 (SCF 未補正) を含む。Ideal として扱う
        STATE.vulnCoeff        = d.effectiveCoverage.asIsVulnCoeff;
        STATE.vulnCoeff_ideal  = d.effectiveCoverage.asIsVulnCoeff;
        // flag 残す: SCF 未補正
      } else if (d.threatCoverage){
        // v1.0.0 以前の後方互換: SCF 補正なし
        const tc = d.threatCoverage;
        const asIsIdeal = Math.max(0, 1.0 - (tc.coveredAsIs / tc.total));
        STATE.vulnCoeff        = asIsIdeal;
        STATE.vulnCoeff_ideal  = asIsIdeal;
      }

      /* === TO-BE vulnCoeff: 新MAAZ形式(effectiveCoverage)はSCF補正済、旧形式はSCF=1.0扱い === */
      if (d.effectiveCoverage){
        // 新MAAZ形式(effectiveCoverage あり): MAAZ側でSCF補正済の値をそのまま受取
        STATE.toBe_vulnCoeff       = d.effectiveCoverage.toBeVulnCoeffEffective;
        STATE.toBe_vulnCoeff_ideal = d.effectiveCoverage.toBeVulnCoeffIdeal;
        STATE.maazEffectiveCoverage = d.effectiveCoverage;
      } else if (d.threatCoverage){
        // 旧MAAZ形式(threatCoverage のみ): SCF補正なし（理想値=実効値）
        const toBe = 1.0 - (d.threatCoverage.coveredToBe / d.threatCoverage.total);
        STATE.toBe_vulnCoeff       = toBe;
        STATE.toBe_vulnCoeff_ideal = toBe;
        STATE.maazEffectiveCoverage = null;
      }

      /* === DLP系 vulnCoeff: ztCur/ztTgt を基準に DLP技法カバー状況を算出 ===
         旧版の fromLv>=3 判定ではJSONの全施策が fromLv=2 だった場合に AS-IS
         カバーが全く検出できず、dlpVulnCoeff=1.0 (完全脆弱) と過大評価する問題を修正。
         ztCur[actionId] >= toLv なら「その施策が既に到達済み」とみなし AS-IS covered に含める。
         v1.0.1 fix: AS-IS にも Data柱SCF補正を適用し、TO-BE との対称性を確保 (BUG#2対応)。
      */
      if (d.actions && Array.isArray(d.actions)){
        const dlpTechSet = new Set(DLP_TECHNIQUES);
        let dlpAsIsCovered = new Set(), dlpToBeCovered = new Set();
        d.actions.forEach(a => {
          (a.threats || []).forEach(t => {
            if (dlpTechSet.has(t)){
              const curLv = (d.ztCur && d.ztCur[a.id]) ?? 1;
              const tgtLv = (d.ztTgt && d.ztTgt[a.id]) ?? 1;
              if (curLv >= a.toLv) dlpAsIsCovered.add(t);
              if (tgtLv >= a.toLv) dlpToBeCovered.add(t);
            }
          });
        });
        const dlpTotal = DLP_TECHNIQUES.length;
        STATE.dlpVulnCoeff_ideal      = Math.max(0, 1.0 - (dlpAsIsCovered.size / dlpTotal));
        STATE.toBe_dlpVulnCoeff_ideal = Math.max(0, 1.0 - (dlpToBeCovered.size / dlpTotal));

        /* Data柱SCFで DLP の AS-IS・TO-BE 両方を補正（対称性確保）
           SCF=1.0 なら補正なし（理想＝実効）
           SCF=0.0 なら実効値=1.0 (全く緩和されない)に劣化

           v1.8.0: MAAZ v3.4.0 の SCF二重化に追随。
           v1.7.5 までは byPillar.Data.scf（単一値）を AS-IS・TO-BE 両方に適用していたため、
           MAAZ 側で解消された「単一SCF問題」が OVERDUE 側に残っていた。
           新: AS-IS は scf（意味は不変＝AS-ISスコープ）、TO-BE は scfToBe を使う。
           フォールバック規約: scfToBe 欠落（旧 MAAZ export）時は AS-IS 値にフォールバックし、
           v1.7.5 と完全に同一の数値挙動を保つ。 */
        const dataSCF_asis = d.effectiveCoverage?.byPillar?.["Data"]?.scf ?? 1.0;
        const dataSCF_tobe = d.effectiveCoverage?.byPillar?.["Data"]?.scfToBe ?? dataSCF_asis;
        STATE.dlpVulnCoeff = Math.max(0,
          STATE.dlpVulnCoeff_ideal + (1.0 - STATE.dlpVulnCoeff_ideal) * (1.0 - dataSCF_asis)
        );
        STATE.toBe_dlpVulnCoeff = Math.max(0,
          STATE.toBe_dlpVulnCoeff_ideal + (1.0 - STATE.toBe_dlpVulnCoeff_ideal) * (1.0 - dataSCF_tobe)
        );
      } else if (d.statuses){
        // 後方互換: 旧 d.statuses 形式 (v4初期)
        const techs = Object.keys(d.statuses);
        let effCount = 0, gapCount = 0, dlpTotal = 0, dlpGap = 0;
        techs.forEach(tid => {
          const s = d.statuses[tid];
          if (s === 'na' || s === 'N/A') return;
          effCount++;
          const isGap = (s === 'none' || s === 'minimal' || s === 'None' || s === 'Minimal' || s === 0 || s === 1);
          if (isGap) gapCount++;
          if (DLP_TECHNIQUES.includes(tid)){ dlpTotal++; if (isGap) dlpGap++; }
        });
        STATE.dlpVulnCoeff = dlpTotal > 0 ? dlpGap / dlpTotal : 1.0;
        STATE.dlpVulnCoeff_ideal = STATE.dlpVulnCoeff;
        STATE.toBe_dlpVulnCoeff_ideal = STATE.toBe_dlpVulnCoeff;
      }

      /* === メタ情報保持（表示・ボトルネック警告用）=== */
      if (d.ztCur) STATE.ztCur = d.ztCur;
      if (d.ztTgt) STATE.ztTgt = d.ztTgt;
      if (d.overall) STATE.maazOverall = d.overall;
      if (d.bottleneck) STATE.maazBottleneck = d.bottleneck;
      if (d.pillarScores) STATE.pillarScores = d.pillarScores;
      if (d.scopeState) STATE.maazScopeState = d.scopeState;
      /* v1.1.3: ②拡張 — actions と threat technique counts */
      if (d.actions && Array.isArray(d.actions)) STATE.maazActions = d.actions;
      if (d.threatCoverage){
        STATE.maazNewlyMitigated = d.threatCoverage.newlyMitigated ?? null;
        STATE.maazThreatTotal    = d.threatCoverage.total ?? null;
      }
      /* v1.2.2: maazAdoptedActions / maazActionCosts は廃止されたためリセット処理も不要 */

      STATE.maazLoaded = true;
      /* ③ 後方互換: customer は string (MAAZ v1.0.1以前) または object {company_name, session_id} (v1.0.2+) */
      let customerName = '';
      let sessionId = null;
      if (typeof d.customer === 'object' && d.customer !== null){
        customerName = d.customer.company_name || '';
        sessionId = d.customer.session_id || null;
      } else {
        customerName = d.customer || '';
      }
      STATE.maazCustomer = customerName;
      if (customerName && !STATE.customer){ STATE.customer = customerName; }
      /* ④: session_id lineage 捕捉 */
      if (sessionId){
        if (!STATE.sourceSessions) STATE.sourceSessions = {};
        STATE.sourceSessions.maaz = sessionId;
      }
      renderAll();

      const asIsPct = (STATE.vulnCoeff * 100).toFixed(0);
      const toBePct = (STATE.toBe_vulnCoeff * 100).toFixed(0);
      /* v1.7.2 (QA Bug #8): AS-IS と TO-BE で SCF 補正状況が違う場合を正直に表示 */
      let suffix = '';
      if (d.effectiveCoverage){
        if (STATE.vulnCoeff_is_scf_corrected){
          suffix = ' (AS-IS/TO-BE 両方 SCF補正済)';
        } else {
          suffix = ' (TO-BE のみ SCF補正済 / MAAZ v1.0.4+ 推奨)';
        }
        /* v1.8.0 (Bug #8 規約踏襲): SCF二重化された export かどうかを正直に示す。
           scfToBe を持たない旧 export では AS-IS SCF を TO-BE にも流用している事実を明示する。 */
        const bp = d.effectiveCoverage.byPillar;
        const hasToBeSCF = bp && typeof bp === 'object' &&
          Object.keys(bp).some(p => bp[p] && typeof bp[p].scfToBe === 'number');
        suffix += hasToBeSCF ? ' · TO-BEスコープ補正適用' : ' · TO-BEスコープ未分離 (AS-IS SCF 流用)';
      }
      /* v1.9.1 (P2-1): 途中で異常を検出していた場合、成功トーストを警告級に格下げして
         件数と先頭メッセージを載せる。異常ゼロなら従来どおり中立トースト。 */
      const sev = endToastScope();
      showToast('MAAZ連携: AS-IS ' + asIsPct + '% → TO-BE ' + toBePct + '%' + suffix + sev.note, sev.worst);
    } catch(e){ showToast('読み込みエラー: ' + e.message, 'bad'); }
    finally { _toastScope = null; }  /* 早期 return / 例外でもスコープを残さない */
  });
}

function importForg(){
  fileDialog('.json', text => {
    beginToastScope();  /* v1.9.1 (P2-1): importMAAZ と同構造の握り潰しを防ぐ */
    try {
      const d = JSON.parse(text);
      /* v1.9.1 (QA P3): format 前置チェック。importMAAZ と対称にする。
       * 従来は format が 'maaz-v4' 等でも下の legacy 分岐（bare S/L/C/LP）まで落ち、
       * 全変数が既定 0.5 のまま「Forg 連携完了」と表示される取り違えが起きえた。
       * 既存の受理範囲は変えない — Forg 側の export は format:'forg-v4' を持つ
       * （Forg v3.2.2 の export 実装）ので /^forg/i のゲートを通り、
       * format を持たない旧形式・手編集 JSON も従来どおり通る。
       * 弾くのは「format が在るのに forg 系でない」場合だけ。 */
      if (d.format != null &&
          (typeof d.format !== 'string' || !/^forg/i.test(d.format.trim()))){
        showToast('Forg (forg-v4系) 形式ではありません: format=' + String(d.format), 'bad');
        return;
      }
      /* v1.7.2 TRANSP-12: Forg 変数正規化の境界条件修正
       * v1.3.6 fix (Bug #8): Forg v4 native 0-5 スケール (非整数) の正しい扱い
       *
       * 【v1.3.5 までの問題点】
       * (A) schema デフォルトが 'normalized-0-1' で、3.6 のような値は Math.min(1, v) でクランプ
       *     → Forg JSON の S=3.6, L=3.4, C=3.25, LP=2.6 がすべて 1.0 にクランプされ、
       *       UI 表示は全て 100%、摩擦係数 F も実態と乖離
       * (B) Forg v4 は整数ではなく非整数の 1-5 または 0-5 スケール値を出力するが、
       *     旧 norm() は「整数 1-5 のみ Likert」として扱い、非整数は 'out of range' 警告だった
       *
       * 【v1.3.6 の修正】
       * (1) 明示スキーマ ('likert-1-5' / 'normalized-0-1' / 'scale-0-5') は従来通り尊重
       * (2) 自動判別ロジックを追加: 0 < v <= 1 なら正規化済、1 < v <= 5 なら Forg 0-5 スケール
       * (3) 0-5 スケールは v/5 で正規化 (これにより F_org 比率は保存され、Forg 側の F_value と一致)
       *
       * 【なぜ v/5 で (v-1)/4 ではないのか】
       * Forg JSON の F_value = (S×L)/(C×LP) を raw Likert で計算した値。
       * すなわち Forg 自身は raw 値を使って F を算出している。
       * v/5 は raw 値の線形スケーリングで比率を保存する (F_org 不変)。
       * (v-1)/4 は原点シフトを伴うため F_org が変わってしまう (Forg 側の F_value と乖離)。
       */
      const norm = (v, schema) => {
        // null/undefined ガード
        if (v === null || v === undefined || isNaN(v)) return 0.5;  // 中立値フォールバック
        // (1) スキーマ明示優先
        if (schema === 'likert-1-5'){
          return Math.max(0, Math.min(1, (v - 1) / 4));
        }
        if (schema === 'normalized-0-1'){
          return Math.max(0, Math.min(1, v));
        }
        if (schema === 'scale-0-5' || schema === 'forg-v4'){
          return Math.max(0, Math.min(1, v / 5));
        }
        // (2) 自動判別
        if (v < 0) return 0;
        if (v <= 1) return v;  // 0-1 正規化済とみなす
        if (v <= 5) return v / 5;  // Forg native 0-5 スケール (例: 3.6 → 0.72)
        // (3) 範囲外
        console.warn(`Forg variable out of expected range: ${v} (expect 0-1 normalized or 0-5 Forg scale). Clamping to 1.`);
        return 1;
      };
      if (d.meta?.schema_version && d.forg?.variables){
        const v = d.forg.variables;
        /* v1.7.2 (QA Bug #10): auto-detect must be per-JSON (global), not per-variable.
         * Forg v4 raw sample: S=5, L=5, C=0.1, LP=0.1 — C/LP are valid raw values <=1,
         * but per-variable auto-detect mis-classifies them as 'normalized 0-1'.
         * Resolution rule: if any variable > 1, treat ALL as 0-5 raw scale.
         */
        const vals = [v.S, v.L, v.C, (v.LP ?? v.Lp ?? v.lp)].filter(x => typeof x === 'number' && !isNaN(x));
        const anyAbove1 = vals.some(x => x > 1);
        const schema = d.meta?.variable_scale ?? (anyAbove1 ? 'scale-0-5' : 'normalized-0-1');
        STATE.forgS = norm(v.S ?? 0.5, schema);
        STATE.forgL = norm(v.L ?? 0.5, schema);
        STATE.forgC = norm(v.C ?? 0.5, schema);
        STATE.forgLp = norm(v.LP ?? v.Lp ?? v.lp ?? 0.5, schema);
        STATE.forgArchetype = d.forg.archetype?.name_ja ?? d.forg.archetype?.name ?? '不明';
        /* v1.7.2: archetype code を捕捉 (統一摩擦モデルのマッピング用) */
        STATE.forgArchetypeCode = d.forg.archetype?.code ?? d.forg.archetype?.id ?? d.forg.archetype?.cell_id ?? null;  /* v1.7.2 (QA Bug #2): Forg v1.1.0 emits cell_id */
        STATE.forgLoaded = true;
        STATE.forgCustomer = d.customer?.company_name ?? '';
        /* ④: session_id lineage 捕捉 (Forg の session_id は customer.session_id または meta.session_id) */
        const forgSessionId = d.customer?.session_id || d.meta?.session_id || null;
        if (forgSessionId){
          if (!STATE.sourceSessions) STATE.sourceSessions = {};
          STATE.sourceSessions.forg = forgSessionId;
        }
        /* v1.3.6: F_value cross-check (Forg 側が提供する F_org 値と当ツールの計算が一致するか確認) */
        if (typeof d.forg.F_value === 'number' && isFinite(d.forg.F_value)){
          const localForg = (STATE.forgS * STATE.forgL) / Math.max(1e-6, STATE.forgC * STATE.forgLp);  /* v1.7.2 (QA Bug #3): 0.01 floor was too aggressive at raw→normalized boundary; use 1e-6 to preserve ratio and match Forg's raw computation. */
          const relDiff = Math.abs(localForg - d.forg.F_value) / Math.max(0.01, d.forg.F_value);
          if (relDiff > 0.02){  // 2% 誤差を超えたら警告
            console.warn(`Forg F_value mismatch: JSON=${d.forg.F_value.toFixed(4)}, computed=${localForg.toFixed(4)} (${(relDiff*100).toFixed(1)}% relative diff). Check scale normalization.`);
            showToast(`Forg F_value 不整合: JSON=${d.forg.F_value.toFixed(2)}, 計算=${localForg.toFixed(2)}`, 'warn');
          }
        }
        renderAll();
        const sevS = endToastScope();  /* v1.9.1 (P2-1) */
        showToast('Forg 連携完了: ' + STATE.forgArchetype + sevS.note, sevS.worst);
        return;
      }
      if (!d.format && !d.scores && !d.results && d.S === undefined && d.s === undefined){
        showToast('Forg形式ではありません', 'bad'); return;
      }
      let s, l, c, lp, arch;
      if (d.format === 'forg-v4' || d.format === 'forg' || (typeof d.format === 'string' && d.format.startsWith('forg-v4'))){
        s = d.S ?? d.s ?? d.silo ?? 0.5;
        l = d.L ?? d.l ?? d.legacy ?? 0.5;
        c = d.C ?? d.c ?? d.crisis ?? 0.5;
        lp = d.LP ?? d.Lp ?? d.lp ?? d.leadership ?? 0.5;
        arch = d.archetype ?? d.archetype_label ?? '不明';
      } else if (d.scores){
        s = d.scores.S ?? d.scores.s ?? 0.5; l = d.scores.L ?? d.scores.l ?? 0.5;
        c = d.scores.C ?? d.scores.c ?? 0.5; lp = d.scores.LP ?? d.scores.Lp ?? d.scores.lp ?? 0.5;
        arch = d.archetype ?? '不明';
      } else if (d.results){
        s = d.results.S ?? d.results.s ?? 0.5; l = d.results.L ?? d.results.l ?? 0.5;
        c = d.results.C ?? d.results.c ?? 0.5; lp = d.results.LP ?? d.results.Lp ?? d.results.lp ?? 0.5;
        arch = d.results.archetype ?? '不明';
      } else {
        s = d.S ?? d.s ?? 0.5; l = d.L ?? d.l ?? 0.5;
        c = d.C ?? d.c ?? 0.5; lp = d.LP ?? d.Lp ?? d.lp ?? d.L_prime ?? 0.5;
        arch = d.archetype ?? '不明';
      }
      STATE.forgS = norm(s); STATE.forgL = norm(l);
      STATE.forgC = norm(c); STATE.forgLp = norm(lp);
      STATE.forgArchetype = arch; STATE.forgLoaded = true;
      /* v1.7.2: legacy Forg 形式では archetype が名前文字列のみ。
       * 既知の archetype 名 (JP/EN) → code への逆引きを試みる。
       * 一致しなければ null (加重平均フォールバックが使われる) */
      const archNameToCode = {
        // 英名
        'aligned & agile': 'aligned-agile', 'aligned and agile': 'aligned-agile',
        'heroic minority': 'heroic-minority',
        'silent drift': 'silent-drift',
        'fragmented': 'fragmented',
        'siloed & stuck': 'siloed-stuck', 'siloed and stuck': 'siloed-stuck',
        // 日本語訳 (Forg 側の訳語に合わせ、実データで調整可能)
        '統率・機敏': 'aligned-agile', '健全・機敏': 'aligned-agile',
        '英雄依存': 'heroic-minority',
        '慣性停滞': 'silent-drift', 'サイレントドリフト': 'silent-drift',
        '分断': 'fragmented',
        'サイロ硬直': 'siloed-stuck', 'サイロ停滞': 'siloed-stuck',
      };
      STATE.forgArchetypeCode = (arch && typeof arch === 'string')
        ? (archNameToCode[arch.toLowerCase()] ?? archNameToCode[arch] ?? null)
        : null;
      STATE.forgCustomer = d.customer ?? d.company ?? '';
      renderAll();
      const sevL = endToastScope();  /* v1.9.1 (P2-1) */
      showToast('Forg 連携完了: ' + arch + sevL.note, sevL.worst);
    } catch(e){ showToast('読み込みエラー: ' + e.message, 'bad'); }
    finally { _toastScope = null; }
  });
}

function _hsBlank(v){ return v === null || v === undefined || String(v).trim() === ''; }
function _hsToNum(raw){
  if (_hsBlank(raw)) return null;
  /* 全角数字・和欧のカンマ・空白・%記号を除去してから数値化 */
  let s = String(raw).trim()
    .replace(/[０-９]/g, d => String.fromCharCode(d.charCodeAt(0) - 0xFEE0))
    .replace(/[，、]/g, '').replace(/,/g, '')
    .replace(/[％%]/g, '').replace(/\s+/g, '');
  if (s === '') return null;
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

/* ---- 最小ZIPリーダ (DecompressionStream 'deflate-raw') ---- */
async function _zipInflateRaw(bytes){
  const ds = new DecompressionStream('deflate-raw');
  const buf = await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
  return new Uint8Array(buf);
}
function _zipReadDirectory(u8){
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let eocd = -1;
  const minPos = Math.max(0, u8.length - (22 + 65535));
  for (let i = u8.length - 22; i >= minPos; i--){ if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; } }
  if (eocd < 0) throw new Error('壊れた xlsx: ZIP の終端(EOCD)が見つかりません');
  const cdCount = dv.getUint16(eocd + 10, true);
  const cdOffset = dv.getUint32(eocd + 16, true);
  const entries = {}; let p = cdOffset;
  for (let n = 0; n < cdCount; n++){
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('壊れた xlsx: Central Directory 署名不一致');
    const method = dv.getUint16(p + 10, true);
    const compSize = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true);
    const extraLen = dv.getUint16(p + 30, true);
    const commentLen = dv.getUint16(p + 32, true);
    const localOffset = dv.getUint32(p + 42, true);
    const name = new TextDecoder('utf-8').decode(u8.subarray(p + 46, p + 46 + nameLen));
    entries[name] = { method, compSize, localOffset };
    p += 46 + nameLen + extraLen + commentLen;
  }
  return entries;
}
async function _zipExtract(u8, entry){
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  const lo = entry.localOffset;
  if (dv.getUint32(lo, true) !== 0x04034b50) throw new Error('壊れた xlsx: Local File Header 署名不一致');
  const nameLen = dv.getUint16(lo + 26, true);
  const extraLen = dv.getUint16(lo + 28, true);
  const dataStart = lo + 30 + nameLen + extraLen;
  const comp = u8.subarray(dataStart, dataStart + entry.compSize);
  if (entry.method === 0) return comp;                    /* stored */
  if (entry.method === 8) return await _zipInflateRaw(comp); /* deflate */
  throw new Error('未対応の圧縮方式 (method=' + entry.method + ')');
}

/* ---- 最小 xlsx パーサ (DOMParser 非依存の正規表現スキャン) ---- */
function _xmlDecode(bytes){ return new TextDecoder('utf-8').decode(bytes); }
function _xmlUnescape(s){
  return s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"')
          .replace(/&apos;/g,"'").replace(/&#(\d+);/g,(_,d)=>String.fromCodePoint(+d))
          .replace(/&#x([0-9a-fA-F]+);/g,(_,h)=>String.fromCodePoint(parseInt(h,16)))
          .replace(/&amp;/g,'&');
}
function _xmlSharedStrings(xml){
  const out = []; const siRe = /<si\b[^>]*>([\s\S]*?)<\/si>/g; let m;
  while ((m = siRe.exec(xml))){
    let text = '', any = false; const tRe = /<t\b[^>]*>([\s\S]*?)<\/t>/g; let tm;
    while ((tm = tRe.exec(m[1]))){ text += tm[1]; any = true; }
    out.push(any ? _xmlUnescape(text) : '');
  }
  return out;
}
function _xmlWorkbookSheets(xml){
  const out = []; const re = /<sheet\b[^>]*\/?>/g; let m;
  while ((m = re.exec(xml))){
    const name = /name="([^"]*)"/.exec(m[0]); const rid = /r:id="([^"]*)"/.exec(m[0]);
    if (name && rid) out.push({ name: _xmlUnescape(name[1]), rid: rid[1] });
  }
  return out;
}
function _xmlRels(xml){
  const out = {}; const re = /<Relationship\b[^>]*\/?>/g; let m;
  while ((m = re.exec(xml))){
    const id = /Id="([^"]*)"/.exec(m[0]); const target = /Target="([^"]*)"/.exec(m[0]);
    if (id && target) out[id[1]] = target[1];
  }
  return out;
}
function _xmlSheetCells(xml){
  const cells = {};
  /* 自己終了 "<c .../>" が次セルの <v> を飲み込まないよう属性を非貪欲に限定 */
  const cRe = /<c\b((?:[^>"]|"[^"]*")*?)(?:\/>|>([\s\S]*?)<\/c>)/g; let m;
  while ((m = cRe.exec(xml))){
    const attrs = m[1]; const inner = m[2] || '';
    const ref = /r="([A-Z]+\d+)"/.exec(attrs);
    if (!ref) continue;
    const t = (/t="([^"]*)"/.exec(attrs) || [,'n'])[1];
    let val = null;
    if (t === 'inlineStr'){
      let text = ''; const tRe = /<t\b[^>]*>([\s\S]*?)<\/t>/g; let tm;
      while ((tm = tRe.exec(inner))) text += tm[1];
      val = _xmlUnescape(text);
    } else {
      const vm = /<v\b[^>]*>([\s\S]*?)<\/v>/.exec(inner);
      if (vm) val = vm[1];
    }
    cells[ref[1]] = { v: val, t };
  }
  return cells;
}
function _xmlCellValue(cell, shared){
  if (!cell || cell.v === null || cell.v === undefined) return null;
  if (cell.t === 's'){ const idx = parseInt(cell.v, 10); return (shared[idx] !== undefined ? shared[idx] : null); }
  if (cell.t === 'inlineStr' || cell.t === 'str') return _xmlUnescape(cell.v);
  return _xmlUnescape(cell.v);
}

async function _readHearingWorkbook(u8){
  if (typeof DecompressionStream === 'undefined')
    throw new Error('このブラウザは DecompressionStream に未対応です。対応ブラウザ (Chrome/Edge/Firefox/Safari 最新) で開くか、MAAZ/Forg の JSON インポートをご利用ください。');
  const dir = _zipReadDirectory(u8);
  const need = n => { if (!dir[n]) throw new Error('xlsx 構造が不正: 必須エントリ欠落 (' + n + ')'); return dir[n]; };
  const wbXml = _xmlDecode(await _zipExtract(u8, need('xl/workbook.xml')));
  const relsXml = _xmlDecode(await _zipExtract(u8, need('xl/_rels/workbook.xml.rels')));
  const sheets = _xmlWorkbookSheets(wbXml);
  const rels = _xmlRels(relsXml);
  let shared = [];
  if (dir['xl/sharedStrings.xml']) shared = _xmlSharedStrings(_xmlDecode(await _zipExtract(u8, dir['xl/sharedStrings.xml'])));
  const cache = {};
  async function cellsOf(name){
    if (cache[name]) return cache[name];
    const s = sheets.find(x => x.name === name);
    if (!s) return null;
    let target = rels[s.rid];
    if (!target) return null;
    if (target.startsWith('/')) target = target.slice(1);
    else if (!target.startsWith('xl/')) target = 'xl/' + target.replace(/^\.\//, '');
    const ent = dir[target];
    if (!ent) throw new Error('xlsx 構造が不正: シート実体が見つかりません (' + name + ')');
    return (cache[name] = _xmlSheetCells(_xmlDecode(await _zipExtract(u8, ent))));
  }
  return {
    sheetNames: sheets.map(s => s.name),
    async get(sheetName, cellRef){
      const cells = await cellsOf(sheetName);
      if (!cells) return null;
      return _xmlCellValue(cells[cellRef], shared);
    }
  };
}

/* バイナリ用ファイルダイアログ (fileDialog はテキスト専用のため別立て) */
function fileDialogBinary(accept, cb){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = accept;
  inp.onchange = e => {
    const f = e.target.files[0];
    if (f){ const r = new FileReader(); r.onload = ev => cb(new Uint8Array(ev.target.result), f.name); r.readAsArrayBuffer(f); }
  };
  inp.click();
}

function importHearingSheet(){
  fileDialogBinary('.xlsx', async (u8, fileName) => {
    beginToastScope();  /* v1.9.1 (P2-1): importMAAZ と同構造の握り潰しを防ぐ */
    try {
      const wb = await _readHearingWorkbook(u8);
      /* (1) 契約シート存在チェック */
      if (!wb.sheetNames.includes('_endeavor_import'))
        throw new Error('_endeavor_import シートがありません。ヒアリングシート (v1.0) を使用してください。');
      /* (2) format 検証 (リテラル B3, 前方一致) */
      const fmt = await wb.get('_endeavor_import', 'B3');
      if (_hsBlank(fmt) || !String(fmt).startsWith(HEARING_FORMAT_PREFIX))
        throw new Error(`format 不一致: "${fmt ?? '(空)'}"。想定 "${HEARING_FORMAT_PREFIX}" 系のヒアリングシートではありません。`);

      /* (3) データ読取 — K優先・単位乗数適用・空スキップ・明示0は0で適用 */
      const staged = {}; const secStaged = {};
      let applied = 0, skipped = 0;
      const coeffWarn = [];
      for (const [key, sheet, row, mult] of HEARING_MAP){
        const kv = await wb.get(sheet, 'K' + row);
        const jv = await wb.get(sheet, 'J' + row);
        const raw = !_hsBlank(kv) ? kv : (!_hsBlank(jv) ? jv : null);
        if (_hsBlank(raw)){ skipped++; continue; }
        if (HEARING_STRING_KEYS.has(key)){ staged[key] = String(raw).trim(); applied++; continue; }
        const num = _hsToNum(raw);
        if (num === null){ skipped++; continue; }
        let val = num * mult;
        /* vulnCoeff/forg系は [0,1] レンジガード (既存 MAAZ ガードと同思想) */
        if (HEARING_COEFF_KEYS.has(key)){
          if (val < 0 || val > 1){
            coeffWarn.push(`${key}=${val}`);
            val = Math.max(0, Math.min(1, val));
          }
        }
        const secM = /^secItems\[(\d+)\]\.cost$/.exec(key);
        if (secM){ secStaged[+secM[1]] = val; applied++; continue; }
        staged[key] = val; applied++;
      }
      if (applied === 0) throw new Error('全ての項目が空です。ヒアリングシートに記入があるか確認してください。');

      /* (4) STATE へ反映 (後勝ち: 直接代入。既存の JSON 後勝ち挙動と整合) */
      Object.keys(staged).forEach(k => { STATE[k] = staged[k]; });
      Object.keys(secStaged).forEach(i => {
        const idx = +i;
        if (STATE.secItems[idx]) STATE.secItems[idx].cost = secStaged[idx];
      });

      /* (5) 来歴: provenance=hearing-sheet として区別。MAAZ/Forg の session_id は偽装しない。
         ただし vulnCoeff / forgS 等をシート由来で上書きした場合、その事実を
         Evidence Banner が示せるよう maazLoaded/forgLoaded を立てる。 */
      const setCyber = ['vulnCoeff','dlpVulnCoeff','toBe_vulnCoeff','toBe_dlpVulnCoeff'].some(k => k in staged);
      const setForg  = ['forgS','forgL','forgC','forgLp'].some(k => k in staged);
      if (setCyber){
        STATE.maazLoaded = true;
        /* MAAZ 由来ではないので理想値=実効値 (SCF補正なし) とし、session lineage は付けない */
        STATE.vulnCoeff_ideal = STATE.vulnCoeff;
        STATE.toBe_vulnCoeff_ideal = STATE.toBe_vulnCoeff;
        STATE.dlpVulnCoeff_ideal = STATE.dlpVulnCoeff;
        STATE.toBe_dlpVulnCoeff_ideal = STATE.toBe_dlpVulnCoeff;
        STATE.maazEffectiveCoverage = null;
        STATE.vulnCoeff_is_scf_corrected = false;
        if (STATE.maazCustomer === '') STATE.maazCustomer = staged.customer || STATE.maazCustomer;
      }
      if (setForg){
        STATE.forgLoaded = true;
        STATE.forgArchetype = STATE.forgArchetype && STATE.forgArchetype !== '未診断'
          ? STATE.forgArchetype : 'ヒアリング入力';
        STATE.forgArchetypeCode = null;
      }
      /* v1.1: ZT負債（12_ZT負債）の計上。debt* が1つでも入っていれば debtLoaded を立て、
         件数系の M列（証跡区分）を集約して申告レベル debtEvidenceLevel を決める
         （全件が「証跡確認済み」のときのみ evidence、それ以外は self、全空なら未設定）。 */
      const setDebt = Object.keys(staged).some(kk => kk.startsWith('debt'));
      if (setDebt){
        STATE.debtLoaded = true;
        STATE.debtCustomer = staged.customer || STATE.customer || STATE.debtCustomer || '';
        let evSeen = 0, evAllVerified = true;
        for (const row of HEARING_DEBT_COUNT_ROWS){
          const mv = await wb.get(HEARING_DEBT_SHEET, 'M' + row);
          if (_hsBlank(mv)) continue;
          evSeen++;
          if (!/証跡|確認済|evidence/i.test(String(mv))) evAllVerified = false;
        }
        STATE.debtEvidenceLevel = evSeen === 0 ? '' : (evAllVerified ? 'evidence' : 'self');
      }
      STATE.hearingLoaded  = true;
      STATE.hearingCustomer = staged.customer || STATE.customer || '';
      STATE.hearingDate     = staged.date || '';
      STATE.hearingFileName = fileName || '';
      STATE.hearingFormat   = String(fmt);
      STATE.hearingApplied  = applied;
      STATE.hearingSkipped  = skipped;

      renderAll();

      if (coeffWarn.length)
        showToast('係数がレンジ [0,1] 外のためクランプ: ' + coeffWarn.join(', '), 'warn');
      /* v1.9.1 (P2-1): 直上の warn を握り潰さないよう、最後の1枚に集約する */
      const sevH = endToastScope();
      showToast(`ヒアリングシート取込: ${STATE.hearingCustomer || '(顧客名なし)'} / 反映 ${applied}件 / スキップ ${skipped}件` + sevH.note, sevH.worst);
    } catch(e){
      showToast('ヒアリングシート取込エラー: ' + e.message, 'bad');
      console.error('importHearingSheet:', e);
    } finally { _toastScope = null; }
  });
}

function issuanceSummary(){
  const n = v => Math.max(0, +v || 0);
  /* 'unaudited' 申告のドライバーは件数を合計に入れない（数えられないと申告した数字を

    .reduce((a, d) => a + n(STATE[d.key]), 0);
  const rep = n(STATE.issueRepaidEnforced);
  return {
    iss, rep, net: iss - rep,
    recorded: iss > 0 || rep > 0,
    open: iss > rep,
    offLedger: off.length,
    off: off.map(d => d.label),
    declared: ISSUE_DRIVERS.filter(d => !!STATE[d.prov]).length,
    inspectOff: STATE.pqcInspectProv === 'unaudited',   /* 1.4.0: 検査可能性の簿外申告 */

    period: STATE.issuePeriodLabel || '今期',

function pqcMosca(){
  const yearNow = +(String(STATE.date || '').slice(0, 4)) || 2026;

  const Zyear = Math.round(+STATE.pqcCrqcYear || 2029);
  const Z = Zyear - yearNow;
  return { X, Y, Z, Zyear, yearNow, margin: Z - (X + Y), entered: X > 0 || Y > 0 };
}

/* ==== 汎用ヘルパ ==== */
const escS = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const oku = x => x / 1e8;

/* 表示上の恒等式（合計 = 内訳の和）を成立させるための最大剰余法（LRM）。表示層専用 — 生値SSOT・計算エンジン・エクスポートは不変。
   parts（非負の生値）を 10^-decimals 刻みで配分し、その合計が「合計の通常丸め」round(total, decimals) に必ず一致するようにする。 */
function lrmParts(parts, total, decimals){
  const scale = Math.pow(10, decimals);
  const P = (parts || []).map(v => (Number.isFinite(v) && v > 0) ? v : 0);
  if (!(total > 0)) return P.map(() => 0);                                 /* 残高≤0 は従来どおり全て 0 */
  const target = Math.round(parseFloat(total.toFixed(decimals)) * scale);  /* 合計は通常丸め → 整数ユニット化 */
  const sum = P.reduce((a,b) => a + b, 0);
  if (sum <= 0){ const z = P.map(() => 0); if (z.length) z[0] = target / scale; return z; }  /* 縮退時の安全側 */
  const exact = P.map(v => Math.round(v / sum * target * 1e6) / 1e6);      /* 微小fp誤差を除去してから整数化 */
  const base  = exact.map(Math.floor);
  const live  = P.map((v,i) => i).filter(i => P[i] > 0);                   /* 生値が厳密に 0 の part には配分しない */
  const diff  = target - base.reduce((a,b) => a + b, 0);
  if (diff > 0){
    const hi = live.slice().sort((a,b) => (exact[b]-base[b]) - (exact[a]-base[a]) || a - b);
    for (let j = 0; j < diff; j++) base[hi[j % hi.length]]++;              /* 剰余の大きい順に +1 */
  } else if (diff < 0){
    const lo = live.slice().sort((a,b) => (exact[a]-base[a]) - (exact[b]-base[b]) || a - b);
    let n = -diff;
    for (const i of lo){ if (n <= 0) break; if (base[i] > 0){ base[i]--; n--; } }  /* 剰余の小さい順に −1（0未満にしない） */
    while (n > 0){ const i = lo.find(k => base[k] > 0); if (i == null) break; base[i]--; n--; }
  }
  return base.map(u => u / scale);
}

/* v1.10.0 (W2-5 / C-1+F-7): 前回帳簿との差分チップ。
   前回スナップショットは calcWithOverride() で算出済みの数値のみを保持しており、
   現在の帳簿（STATE）は一切書き換えていない。未読込時は何も描かない。
   増減の色は「残高が増える＝悪い」「返済が増える＝良い」の会計的向きに従う。 */
function prevDiffHTML(R){
  if (!prevLedger) return '';
  const P = prevLedger.R;
  const rows = [
    { lb:'残高',         now:R.ztdBalance,   was:P.balance,   goodWhen:'down' },
    { lb:'返済可能残高', now:R.ztdRepayable, was:P.repayable, goodWhen:'down' },
    { lb:'STALLED',      now:R.ztdStalled,   was:P.stalled,   goodWhen:'down' },
    { lb:'不可避床',     now:R.ztdFloor,     was:P.floor,     goodWhen:'down' },
    { lb:'返済（net）',  now:R.ztdRepaidNet, was:P.repaidNet, goodWhen:'up'   },
  ];
  const chips = rows.map(r => {
    const d = r.now - r.was;
    const pct = Math.abs(r.was) > 0 ? d / r.was * 100 : null;
    const flat = Math.abs(d) < 1e4;   /* 1万円未満は「変化なし」表示（表示丸めの下） */
    const good = r.goodWhen === 'up' ? d > 0 : d < 0;
    const col = flat ? 'var(--ink-3)' : (good ? 'var(--trust-ink)' : 'var(--danger-ink)');
    const sign = d > 0 ? '+' : (d < 0 ? '−' : '±');
    return '<div style="flex:1 1 150px;padding:10px 14px;border:1px solid var(--line-2);border-radius:10px">'
      + '<div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)">' + escS(r.lb) + '</div>'
      + '<div style="font-family:var(--font-mono);font-size:19px;font-weight:700;color:' + col + ';margin-top:3px">'
      +   (flat ? '±0.00億' : sign + Math.abs(oku(d)).toFixed(2) + '億') + '</div>'
      + '<div style="font-family:var(--font-jp);font-size:11px;color:var(--ink-3);margin-top:2px">'
      +   (flat || pct == null ? '変化なし' : sign + Math.abs(pct).toFixed(1) + '%') + ' ／ 現在 ' + okuStr(r.now) + '</div></div>';
  }).join('');
  const warn = prevLedgerVersionWarn();
  return '<div class="card reveal" style="padding:20px 24px;margin-top:16px">'
    + '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-bottom:10px">'
    +   '<div style="display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)">' + ic('layers', 14) + 'Change since last close · 前回帳簿との差分</div>'
    +   '<button class="btn sm ghost" onclick="clearPrevLedger()">比較を解除</button>'
    + '</div>'
    + '<div style="font-family:var(--font-jp);font-size:11.5px;color:var(--ink-2);line-height:1.7;margin-bottom:10px">'
    +   '前回 <strong>' + escS(jpDate(prevLedger.meta.date) || '（基準日なし）') + '</strong>'
    +   (prevLedger.meta.customer ? '（' + escS(prevLedger.meta.customer) + '）' : '')
    +   ' → 今回 <strong>' + escS(jpDate(STATE.date) || '（基準日なし）') + '</strong>。'
    +   '前回帳簿は比較のためだけに読み込んでおり、現在の帳簿の値・保存内容は変更していません。</div>'
    + (warn ? '<div class="callout" style="margin-bottom:10px"><div style="font-family:var(--font-jp);font-size:11.5px;color:var(--warn-ink);line-height:1.7"><strong>比較元の版が異なります</strong> — ' + escS(warn) + '。数値は表示しますが、版差による定義変更の影響を含む可能性があります。</div></div>' : '')
    + '<div style="display:flex;gap:12px;flex-wrap:wrap">' + chips + '</div></div>';
}

  +     '<details class="explain fold"><summary>この表が新しい金額を作っていないこと · No new money</summary><div class="explain-body">'

  /* 各種 callout・記帳カバレッジ・読み方（折りたたみ）

  + '<section class="section tight"><div class="container">'

          '内訳と読み方 · Why this matters')

  +   ((issuanceSummary().offLedger > 0 || issuanceSummary().inspectOff) ? (

      + leadFold('eyeoff', 'warn', '簿外債務あり — 数えられない借入は、ゼロではありません。',

            + '）。本ページの残高は<strong>下限値</strong>です。',
          issuanceSummary().off.concat(issuanceSummary().inspectOff ? ['暗号化通信の検査可能性（PQC）'] : []).join('・')
            + ' の <strong>' + (issuanceSummary().offLedger + (issuanceSummary().inspectOff ? 1 : 0)) + '項目</strong>が「棚卸不能」と申告されています。本ページの残高と新規借入は<strong>「分母に入っている世界」の下限値</strong>です。なお、スコープ外と判明している暗黙の信頼は MAAZ の AS-IS SCF 経由で計上額に粗く反映済み — 簿外開示はそれと<strong>二重計上しないための注記</strong>です（05 根拠開示 → 勘定の分担）。回収先マップから棚卸しに着手してください。',
          '簿外を金額化しない理由 · Account split')
      + '</div>') : '')
  +   (!issuanceSummary().recorded && issuanceSummary().declared === 0 ? (
        '<div class="callout neutral reveal" style="margin-top:16px">'
      + leadFold('db', 'mute', '新規借入勘定が未記帳です。',
          '数えられる欄は件数を、数える手段がまだない欄は<strong>「棚卸不能」</strong>を申告してください。',
          '帳簿が静かなのは、借入がないからとは限りません。数えられる欄は件数を、数える手段がまだない欄は<strong>「棚卸不能」</strong>を申告してください（01 内訳台帳 → 新規借入勘定・回収先マップ）。',
          'なぜ申告が必要か · Why declare')
      + '</div>') : '')
  +   coverageMeterHTML()
  /* v1.10.0 (W1-1 / F-1): 残高の会計的な性質を明示する読み方カード。
     金額は calc() が既に返している damageB/C/D・cyberProb_asis の表示のみ（新しい式は作らない）。

     v1.10.0 (W1-6 / F-13): 委託先勘定（責任分界点が異なる）が本残高に含まれないことを明示。 */
  +   '<details class="explain reveal">'
  +     '<summary>' + ic('db', 14) + 'How to read this number · この数字の読み方</summary>'
  +     '<div class="explain-body">'
  +     '<div style="font-family:var(--font-jp);font-size:12.5px;color:var(--ink);line-height:1.9;max-width:860px">'
  +     '<strong>この残高は「年間の確率加重期待損失」です。当年のPL計上額でも、引当金でもありません。</strong>会計上の負債として計上される性質のものではなく、経営が優先順位を決めるための管理会計上の残高です。<br>'
  +     'インシデントが実際に発生した場合の<strong>キャッシュアウトは残高ではなく被害額そのもの</strong>です。計上額（AS-IS期待損失）は、'
  +     '<strong>被害額も発生確率も異なる2つの経路の積の和</strong>として記帳しています（1つの確率を全被害額に掛けているのではありません）。'
  +     '</div>'
  /* v1.10.0 (QA B-1): 旧版は damageB+C+D の合算に単一の cyberProb を掛けて計上額としていたが、
     実装は riskCyber_asis=(B+C)×cyberProb / riskDLP_asis=(D+ipValue)×dlpProb の2経路（00.1 勘定元帳と同じ）。
     電卓照合できるよう経路別に分解し、ipValue（DLP経路の被害額）の脱落も解消する。

  +     '<div style="margin-top:10px;padding:12px 16px;border:1px dashed var(--line-2);border-radius:10px;font-family:var(--font-jp);font-size:12px;color:var(--ink);line-height:1.9">'
  /* v1.10.0 (QA R-1): この2行の確率は2桁表示（pctS(...,2)）。1桁だと真値（例 23.46%）が 23.5% に
     丸まり、画面の小計×確率が積の表示値と最大 1.74億 ずれて電卓照合が閉じない（実測400ケース）。
     2桁なら最大ギャップ 0.022億＝表示単位 0.01億 の最終桁ノイズに収まる。00.1 側は従来どおり1桁。 */
  +       '<div>サイバー侵害経路　<span class="mono">（事業停止B ' + okuStr(R.damageB) + ' ＋ 復旧C ' + okuStr(R.damageC) + ' ＝ ' + okuStr(R.damageB + R.damageC) + '） × ' + pctS(R.cyberProb_asis, 2) + ' ＝ <strong>' + asIsPathAmt[0] + '</strong></span></div>'
  +       '<div>情報漏えい（DLP）経路　<span class="mono">（法的・信用D ' + okuStr(R.damageD) + ' ＋ 知的財産価値 ' + okuStr(STATE.ipValue) + ' ＝ ' + okuStr(R.damageD + STATE.ipValue) + '） × ' + pctS(R.dlpProb_asis, 2) + ' ＝ <strong>' + asIsPathAmt[1] + '</strong></span></div>'
  +       '<div style="margin-top:6px;padding-top:6px;border-top:1px solid var(--line-2)"><span class="mono">合計 ＝ 計上額 <strong>' + okuStr(R.ztdAsIs) + '</strong> − 返済（net） <strong>' + okuStr(R.ztdRepaidNet) + '</strong> ＝ 残高 <strong>' + okuStr(R.ztdBalance) + '</strong></span></div>'
  +       '<div style="font-size:11px;color:var(--ink-3);margin-top:6px">1回発生した場合のキャッシュアウトは、上の被害額そのもの（B＋C＋D、知財毀損は金銭化の性質が異なるため別扱い）。残高はそれに年間発生確率を掛けた確率加重値の側です。経路別の内訳は 00.1 勘定元帳と同じ数字です。各行の金額は表示単位 0.01億円 で四捨五入しているため、画面の数値で検算すると最終桁が一致しない場合があります（恒等式はエンジンの生値で厳密に成立 → 05 根拠開示 · 実行時検算）。</div>'
  +     '</div>'
  +     '<div style="font-family:var(--font-jp);font-size:12.5px;color:var(--ink);line-height:1.9;max-width:860px;margin-top:10px">'
  +     '<strong>本残高に委託先勘定は含まれません</strong> — 責任分界点が異なり自社の成熟度だけでは返済できないため、別建てで記帳しています（→ 01 内訳台帳 · 01.7 委託先勘定）。'
  +     '</div>'
  +   '</div></details>'
  + '</div></section>'

  /* 残高照会は返済ではない */
  + '<section class="section tight"><div class="container">'
  +   '<div class="chapter-marker"><span class="chapter-num">00.3</span><span class="chapter-line"></span><span class="chapter-label">Rule <span class="jp">· 残高照会は、返済ではない</span></span></div>'
  +   '<div class="card reveal" style="padding:22px 26px">'
  +     '<div style="font-family:var(--font-jp);font-size:14px;font-weight:700;color:var(--ink-0);margin-bottom:8px">ATMで残高照会を何度しても、借金は1円も減りません。</div>'
  /* v2.0.0: ルール本体（残高が減る唯一の瞬間）は常時可視のまま。

  +     '可視化・棚卸し（UNKNOWN → VISIBLE）は残高を動かしません。残高が減るのは、ポリシーが強制適用された瞬間（VISIBLE → <strong>ENFORCED</strong>）だけです。</div>'

  +     'この性質は表示上の演出ではなく、計算式のレベルで保証されています（不変条件 INV-D3 — 件数系入力は金額に一切配線されない）。</div></details>'
  +   '</div>'
  + '</div></section>';

/* v1.9.1 (QA P3): 旧 compact 引数は呼び出し側（issuanceLeafHTML）が常に false を渡すのみで
   到達しない分岐だったため削除。callout クラスは常に付与する。 */
function issuanceVerdict(){
  const s = issuanceSummary();
  /* 1.3.0: 簿外申告がある場合は open/closed 判定に下限値注記を付す */
  const offNote = s.offLedger > 0
    ? '<div style="font-family:var(--font-jp);font-size:11px;color:var(--warn-ink);line-height:1.7;margin-top:6px">＋簿外 ' + s.offLedger + '項目（' + s.off.join('・') + '）— 上記の件数は簿外分を除いた<strong>下限値</strong>です。</div>'
    : '';
  if (!s.recorded){
    if (s.offLedger > 0){
      return '<div class="callout">'
        + '<div style="font-family:var(--font-jp);font-size:13px;font-weight:700;color:var(--warn-ink)">簿外債務あり — 数えられない借入は、ゼロではありません</div>'
        + '<div style="font-family:var(--font-jp);font-size:12px;color:var(--ink);line-height:1.7;margin-top:4px">' + s.off.join('・') + ' の ' + s.offLedger + '項目が「棚卸不能」と申告されています。数えられる欄の記帳と、回収先マップからの棚卸し着手が次の一手です。</div></div>';
    }
    return '<div style="font-family:var(--font-jp);font-size:11px;color:var(--ink-3)">未記帳 — 今期の新規発生件数と返済件数を記帳すると、帳簿が「開いているか」を判定します。数える手段がない欄は「棚卸不能」を申告してください。</div>';
  }
  if (s.open){
    return '<div class="callout bad">'
      + '<div style="font-family:var(--font-jp);font-size:13px;font-weight:700;color:var(--danger-ink)">帳簿は開いています — 残高は据え置きではなく、積み増しの途上</div>'
      + '<div style="font-family:var(--font-jp);font-size:12px;color:var(--ink);line-height:1.7;margin-top:4px">' + escS(s.period) + ' の新規借入 <strong>' + s.iss + '件</strong> に対し、返済（ENFORCED遷移）は <strong>' + s.rep + '件</strong>（純増 +' + s.net + '件）。返済が止まっている間も、借入は続いています。</div>' + offNote + '</div>';
  }
  return '<div class="callout ok">'
    + '<div style="font-family:var(--font-jp);font-size:13px;font-weight:700;color:var(--trust-ink)">帳簿は閉じつつあります</div>'
    + '<div style="font-family:var(--font-jp);font-size:12px;color:var(--ink);line-height:1.7;margin-top:4px">' + escS(s.period) + ' の返済（ENFORCED遷移） <strong>' + s.rep + '件</strong> が新規借入 <strong>' + s.iss + '件</strong> を上回っています（純減 ' + s.net + '件）。この状態を維持できるかが焦点です。</div>' + offNote + '</div>';
}

/* ============================================================

/* v1.10.0 (W2-6 / C-3): 各分類が攻撃者から見て何に使われるかの静的タグ。

   残高・確率式・按分には一切接続しない — 表示のみ（INV-D3 と同じ扱い）。 */
const LEAF_ATTACK_TAGS = [
  ['T1021 Remote Services（横展開）'],
  ['T1078 Valid Accounts（正規資格情報の悪用）'],
  ['T1190 Exploit Public-Facing Application（公開資産の悪用）'],
  ['T1098 Account Manipulation', 'T1484 Domain/Tenant Policy Modification'],
];
/* v1.10.0 (W2-8 / C-2b): 担当部門/オーナーの STATE キー（①〜④の順）。金額計算に非配線。 */
const LEAF_OWNER_KEYS = ['ownerCat1','ownerCat2','ownerCat3','ownerCat4'];

/* ============================================================
   v1.10.0 (UX2): 負債4分類の「読まずに分かる」メタ情報
   ------------------------------------------------------------
   お客様評価②「Ledger の各項目が何を示すか読まないと分からない」への対応。

/* v1.10.0 (UX2): 章冒頭の4分類オーバービュー。
   1本の水平スタックバー（②③④の按分値＝既存 items[]）＋4枚のミニカードで、

   ①は按分値を持たない（金額は成熟度経由）ため、バーには乗せず件数と状態で示す。 */
function ledgerOverviewHTML(exp, items, k, st){
  const segs = LEAF_META.filter(m => m.amtKey);
  const vals = segs.map(m => items[m.amtKey] || 0);
  const tot  = vals.reduce((a, b) => a + b, 0);
  /* 構成比は最大剰余法で合計 100% に整合させる（表示のみ・生値は不変）。 */
  const pcts = tot > 0 ? lrmParts(vals, 100, 0) : [];
  const bar  = tot > 0
    ? '<div class="ov-bar" role="img" aria-label="按分値の内訳 — '
        + segs.map((m, i) => m.no + m.ttl + ' ' + okuStr(vals[i])).join('、') + '">'
      + segs.map((m, i) => '<div style="width:' + (vals[i] / tot * 100).toFixed(2) + '%;background:' + m.seg + ';opacity:.72" title="'
          + escS(m.no + ' ' + m.ttl + ' ' + okuStr(vals[i])) + '"></div>').join('')
      + '</div>'
      + '<div class="ov-legend">' + segs.map((m, i) =>
          '<span><span class="rowmark" style="background:' + m.seg + '"></span>' + m.no + ' ' + m.ttl
          + ' <strong class="mono">' + okuStr(vals[i]) + '</strong>（' + pcts[i].toFixed(0) + '%）</span>').join('')
      + '</div>'
    : '';
  /* ミニカードの値：①＝経路本数（金額按分の対象外）、②③④＝按分値。すべて既存値の再掲。 */
  const cardVal = i => i === 0
    ? (st.total > 0
        ? '<div class="ov-amt">' + st.total + '<span class="u">本</span></div>'
        : '<div class="ov-amt" style="color:var(--ink-3)">未計測</div>')
    : '<div class="ov-amt" style="color:' + LEAF_META[i].color + '">' + okuStr(items[LEAF_META[i].amtKey] || 0) + '</div>';
  const cardChips = i => {
    const c = LEAF_META[i].color;
    if (i === 0) return st.total > 0
      ? stChip('強制済', pctS(k.enforcedRate), 'var(--trust-ink)') + stChip('金額は成熟度経由', null, 'var(--ink-3)')
      : '<span class="st-chip mute">経路総数が未計上</span>';
    if (i === 1) return stChip('無期限化', pctS(k.staleExceptionRatio), c) + stChip('例外', exp.tagCounts.exception + '件', 'var(--ink-3)');
    if (i === 2) return stChip('責任者不明', pctS(k.ownerUnknownRatio), c) + stChip('資産', exp.tagCounts.orphan + '件', 'var(--ink-3)');
    return stChip('根拠なし', pctS(k.unjustifiedPrivRatio), c) + stChip('権限', exp.tagCounts.privilege + '件', 'var(--ink-3)');
  };
  const cards = LEAF_META.map((m, i) =>
    '<button type="button" class="ov-card" onclick="jumpLeaf(' + (i + 1) + ')" aria-label="' + escS(m.no + ' ' + m.ttl + ' の明細へ移動') + '">'
    + '<div class="ov-head">'
    +   '<span class="ov-ic" style="color:' + m.color + ';background:color-mix(in oklab,' + m.color + ' 12%,transparent)">' + ic(m.ic, 16) + '</span>'
    +   '<span class="ov-no" style="color:' + m.color + '">' + m.no + '</span>'
    +   '<span class="ov-t">' + m.ttl + '</span>'
    + '</div>'
    + '<div class="ov-sub">' + m.sub + '</div>'
    + cardVal(i)
    + '<div class="ov-foot">' + cardChips(i) + '</div>'
    + '</button>').join('');
  return '<div class="card elevated reveal" style="padding:22px 26px">'
    + '<div style="display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px">'
    +   ic('layers', 14) + 'What you owe · 借金の中身は4つ' + '</div>'
    + bar
    + '<div class="ov-cards">' + cards + '</div>'
    + '<details class="explain fold"><summary>' + ic('info', 13) + '4分類の定義と、①に金額が並ばない理由</summary><div class="explain-body">'
    +   'ZTDは雲をつかむ概念ではありません。中身は「かつては理由があった、あるいはうっかり生まれた信頼」が検証されないまま居座っている4分類です。'
    +   '上のバーは<strong>②③④の按分値（単一推定）</strong>で、その合計は集約残高と一致します（二重計上なし: INV-D6）。'
    +   '<strong>①未検証の東西通信経路には按分額を置いていません</strong> — この分類の金額は成熟度（MAAZ → vulnCoeff → 期待損失）経由で残高に反映済みで、件数が直接金額を動かすことはないためです（INV-D3）。'
    +   'カードをクリックすると該当分類の明細へ移動します。</div></details>'
    + '</div>';
}

/* ============================================================
   02 GRACE — 猶予時間メーター（Zero Day Clock 系列）
   ============================================================ */
/* v1.10.0 (UX2): 02 を2カラム化（左＝カーブ／右＝操作パネル）するにあたり、チャートを
   狭い描画幅でも読める形に作り替える。
   (1) 各行の出典テキストを SVG の外（下の出典リスト）へ移す — 従来は右端 padR=200 に対して
       文字幅が最大 220 単位あり viewBox の外へはみ出して切れていた（実質クリップ）。
   (2) 出典を外に出したぶん padR を 56 に詰め、バーの実効長を伸ばす。
   (3) 描画倍率が 0.8 前後まで落ちるため、SVG 内のフォントを 11/12/13 → 15/16/17 に上げ、
       実効サイズが Ztelier 下限 11px を割らないようにする（1280px 時の実測は後述の自己QAに記載）。
   (4) 高さ 400 → 360。数値・出典・文言そのものは一切変更していない。 */
function buildTTEChartSVG(){
  const w = 1000, h = 360, padL = 130, padR = 56, padT = 46, padB = 40;
  const rows = GRACE.tte;
  const rowH = (h - padT - padB) / rows.length;
  /* 横軸: log10(時間)。0.5h 〜 20000h */
  const lgMin = Math.log10(0.5), lgMax = Math.log10(20000);
  const x0 = padL, x1 = w - padR;
  const X = hrs => x0 + (Math.log10(Math.max(0.5, hrs)) - lgMin) / (lgMax - lgMin) * (x1 - x0);
  const patchX = X(GRACE.patchDays * 24);
  let g = '';
  /* 目盛 */
  const ticks = [[1,'1時間'],[24,'1日'],[24*7,'1週間'],[24*30,'30日'],[24*365,'1年']];
  ticks.forEach(t => {
    const x = X(t[0]);
    g += '<line x1="' + x + '" y1="' + padT + '" x2="' + x + '" y2="' + (h-padB) + '" stroke="var(--line)" stroke-width="1"/>';
    g += '<text x="' + x + '" y="' + (padT-12) + '" text-anchor="middle" font-family="var(--font-jp)" font-size="15" fill="var(--ink-3)">' + t[1] + '</text>';
  });
  /* 防御側: パッチ中央値ライン */
  g += '<line x1="' + patchX + '" y1="' + (padT-2) + '" x2="' + patchX + '" y2="' + (h-padB) + '" stroke="var(--trust)" stroke-width="2" stroke-dasharray="6 4"/>';
  g += '<text x="' + patchX + '" y="' + (h-padB+28) + '" text-anchor="middle" font-family="var(--font-jp)" font-size="15" font-weight="700" fill="var(--trust-ink)">防御側: パッチ適用中央値 43日（DBIR 2026）</text>';
  /* 各年のTTEバー */
  rows.forEach((r, i) => {
    const y = padT + rowH * i + rowH/2;
    const neg = r.hours < 0;
    g += '<text x="' + (padL-14) + '" y="' + (y+5) + '" text-anchor="end" font-family="var(--font-mono)" font-size="17" font-weight="700" fill="var(--ink)">' + r.y + '</text>';
    if (!neg){
      const bx = X(r.hours);
      g += '<line x1="' + x0 + '" y1="' + y + '" x2="' + bx + '" y2="' + y + '" stroke="var(--danger)" stroke-width="10" stroke-linecap="round" stroke-opacity="0.75"/>';
      if (bx > x1 - 110){
        g += '<text x="' + (bx-10) + '" y="' + (y-13) + '" text-anchor="end" font-family="var(--font-jp)" font-size="16" font-weight="700" fill="var(--danger-ink)">' + r.label + '</text>';
      } else {
        g += '<text x="' + (bx+12) + '" y="' + (y+5) + '" font-family="var(--font-jp)" font-size="16" font-weight="700" fill="var(--danger-ink)">' + r.label + '</text>';
      }
    } else {
      /* 公開前悪用が中央値: ゼロ点より左＝軸の外を示す矢印表現 */
      g += '<line x1="' + x0 + '" y1="' + y + '" x2="' + (x0+70) + '" y2="' + y + '" stroke="var(--danger)" stroke-width="10" stroke-linecap="round" stroke-opacity="0.35" stroke-dasharray="2 6"/>';
      g += '<path d="M ' + (x0+4) + ' ' + y + ' l 14 -7 v14 z" fill="var(--danger)"/>';
      g += '<text x="' + (x0+84) + '" y="' + (y+5) + '" font-family="var(--font-jp)" font-size="16" font-weight="700" fill="var(--danger-ink)">' + r.label + '</text>';
    }
  });
  /* 凡例 */
  g += '<text x="' + x0 + '" y="' + (h-padB+28) + '" font-family="var(--font-jp)" font-size="15" fill="var(--danger-ink)" font-weight="700">攻撃側: CVE公開 → 悪用までの中央値（TTE）</text>';
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" style="max-width:100%;height:auto" role="img" aria-label="TTE崩壊カーブとパッチ適用中央値の鋏">'
    + '<line x1="' + x0 + '" y1="' + (h-padB) + '" x2="' + x1 + '" y2="' + (h-padB) + '" stroke="var(--line-2)"/>' + g + '</svg>';
}

  const [repayAmt, stalledAmt, floorAmt] = ztdSplitAmt(R);   /* 00 Statement のタイルと同一の表示金額（LRM整合） */

  /* v1.10.0 (W1-2 / F-3): 「追加のご調達を要さず」の正確な意味を脚注で定義する（工数ゼロの主張ではない）。 */

  + '</div>';

/* ==== JSON 保存 / 読込（上位ツール互換） ==== */
function exportLedgerJSON(){
  const customerName = STATE.customer || '';
  const generatedAt = new Date().toISOString();
  const data = {
    ...STATE,
    climateDraftFloor: undefined, climateDraftSlope: undefined,
    format: 'overdue-v1',
    tool_version: APP_VER.replace(/^v/,''),
    engine: 'ztd-v4.4.1-fork',   /* 旧値 'endeavor-v4.4.1-fork' も import 側で受理（engine は STATE キーではないため読込には影響しない） */
    generated_at: generatedAt,
    customer: { company_name: customerName, session_id: (customerName||'unnamed').trim().toLowerCase().replace(/[^a-z0-9぀-ゟ゠-ヿ一-鿿]+/g,'-').replace(/^-+|-+$/g,'') + '-' + generatedAt.slice(0,10).replace(/-/g,'') },
    source_sessions: STATE.sourceSessions || {},
    exportedAt: generatedAt,
    customer_name: customerName,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'OVERDUE_' + (customerName || 'unnamed') + '_' + STATE.date + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 100);
  showToast('OVERDUE JSON をエクスポートしました');
}
function importLedgerJSON(){
  fileDialog('.json', text => {
    try {
      const d = JSON.parse(text);
      const f = String(d.format || '');
      /* 機械識別子 'endeavor-v1.x' は旧セッション互換のため受理を維持する */
      if (!f.startsWith('overdue') && !f.startsWith('endeavor')){ showToast('対応していない JSON 形式です', 'bad'); return; }
      const known = Object.keys(STATE);
      known.forEach(k => { if (k in d && d[k] !== undefined) STATE[k] = d[k]; });
      /* 旧キー investZscaler → investVendor 後方互換（STATE キーではないため上のループでは拾われない） */
      if (d.investVendor === undefined && d.investZscaler !== undefined) STATE.investVendor = d.investZscaler;
      if (d.investClass && typeof d.investClass === 'object'
          && d.investClass.investVendor === undefined && d.investClass.investZscaler !== undefined){
        STATE.investClass = { ...d.investClass, investVendor: d.investClass.investZscaler };
        delete STATE.investClass.investZscaler;
      }
      /* canonical meta の customer はオブジェクトの場合がある */
      if (d.customer && typeof d.customer === 'object') STATE.customer = d.customer.company_name || d.customer_name || '';
      renderAll();
      showToast((f.startsWith('endeavor') ? '上位ツール' : 'OVERDUE') + ' セッションを読み込みました');
    } catch(e){ showToast('JSON解析エラー: ' + e.message, 'bad'); }
  });
}
